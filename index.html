    section.setFullRenderer(full => {
        if (!steps.length || !fullMetrics.length) {
            full.appendChild(el("div", "card empty-card", "표시할 트레이닝 추이가 없습니다."));
        } else {
            full.appendChild(historyChartsCard(h, steps, fullMetrics));
        }
    });
}

function videoStatus(node, experiment, checkpoint) {
    const state = node.video_watcher || {};
    if (state.status === "failed" && (!state.experiment || state.experiment === experiment))
        return {level: "err", text: "영상 생성 오류: " + (state.error || "감시기 확인 필요")};
    if (state.experiment !== experiment || state.checkpoint !== checkpoint)
        return {level: "unk", text: "영상 미등록 · 생성 요청 확인 필요"};
    if (Date.now() / 1000 - state.updated_at > 360)
        return {level: "warn", text: "영상 감시 상태 오래됨 · 확인 필요"};
    if (state.status === "compatibility_blocked")
        return {level: "warn", text: "환경 변경 감지 · 영상 어댑터 검증 필요"};
    return {level: "unk", text: {generating: "테스트 영상 생성 중", uploading: "영상 업로드 중",
            uploaded: "영상 업로드 완료 · 게시 반영 중"}[state.status] || "영상 대기 중"};
}

function renderRanking(data, nodeName) {
    const host = document.getElementById("rank");
    host.textContent = "";
    const n = (data.status || {})[nodeName] || {};
    const currentExperiment = (primaryProcess(n).experiment || {}).name;
    const perNode = (data.rankings || {})[nodeName];
    const experiment = selectedRuns[nodeName] || currentExperiment || (perNode || {}).experiment;
    const catalog = (data.runs || {})[nodeName] || [];
    const candidate = (perNode && perNode.experiment === experiment)
        ? perNode : catalog.find(r => r && r.experiment === experiment);
    const r = candidate && candidate.node_name === nodeName && candidate.run_id === experiment
        ? candidate : null;
    const media = data.rank_videos || {};
    const videos = (((media._runs || {})[nodeName] || {})[experiment]) || media[nodeName] || {};
    const selectedProcess = selectedRunProcess(data, nodeName);
    const noFixedEvaluation = (selectedProcess.capabilities ||
        (selectedProcess.run_contract || {}).capabilities || {}).fixed_evaluation === false;
    const saved = selectedProcess.latest_checkpoint;
    const belongsToRun = (selectedProcess.experiment || {}).name === experiment;
    const latestSaved = belongsToRun && saved && /^full_\d+\.pt$/.test(saved.name || '')
        ? {node_name: nodeName, run_id: experiment, checkpoint: saved.name,
           iteration: saved.iteration, checkpoint_sha256: saved.sha256,
           verified: false, artifact_only: true} : null;
    const rankedLatest = r && r.latest;
    const latest = latestSaved && (!rankedLatest || latestSaved.iteration > rankedLatest.iteration)
        ? latestSaved : (rankedLatest || latestSaved);

    const head = el("div", "section-h");
    head.appendChild(el("h2", "", "Checkpoint Ranking"));
    if (experiment) {
        const sub = el("span", "sub mono", experiment);
        sub.title = experiment;
        head.appendChild(sub);
    }
    host.appendChild(head);

    if (!r || r.error || ![r.latest, r.best_reward, r.best_vx_rmse].some(Boolean)) {
        host.appendChild(notice("info",
                            noFixedEvaluation ? "고정 평가 미설정 · 최신 체크포인트는 평가와 별도로 표시합니다."
                            : "평가가 완료된 체크포인트 랭킹이 없습니다.", "rank-notice"));
    } else if (!r.verified_count) {
        host.appendChild(notice("info",
            "기존 체크포인트와 점수는 보존되어 있습니다. BEST는 동일 조건에서 체크포인트·정규화 파일과의 연결이 검증된 평가로만 선정합니다.",
            "rank-notice"));
    }

    const cards = [
        ["LATEST", "latest", latest],
        ["BEST REWARD", "best_reward", !noFixedEvaluation && r && r.best_reward],
        ["BEST VX RMSE", "best_vx_rmse", !noFixedEvaluation && r && r.best_vx_rmse],
    ];
    const descriptions = {
        latest: "가장 최근에 저장된 체크포인트",
        best_reward: "검증된 평가 리워드가 가장 높은 체크포인트",
        best_vx_rmse: "검증된 전진 속도 추종 오차가 가장 작은 체크포인트",
    };
    // One column per slot. A slot without a matching checkpoint gets a single
    // cell spanning every row, stating why, instead of a column of dashes.
    const columns = [];
    for (const [title, slot, v] of cards) {
        const column = { title: title, description: descriptions[slot] };
        columns.push(column);
        if (!v || v.node_name !== nodeName || v.run_id !== experiment) {
            if (slot === 'latest' || noFixedEvaluation) {
                column.unavailable = {
                    level: "unk",
                    state: slot === 'latest' ? '저장된 체크포인트 없음' : '고정 평가 미설정',
                    note: slot === 'latest'
                        ? '선택한 학습에서 수집된 체크포인트가 아직 없습니다.'
                        : '평가 점수가 없어 BEST를 선정하지 않습니다.' };
                continue;
            }
            const unavailable = !r || r.error;
            column.unavailable = {
                level: unavailable ? "warn" : "unk",
                state: unavailable ? "랭킹 데이터 확인 필요" :
                    slot === "latest" ? "체크포인트 대기" : "검증 대기 · BEST 미선정",
                note: unavailable
                    ? "선택한 학습의 랭킹 데이터를 아직 확인할 수 없습니다."
                    : slot === "latest" ? "수집된 체크포인트가 아직 없습니다."
                    : "선정 조건을 충족한 평가가 없습니다. 기존 체크포인트는 재평가가 필요하며, 이 표시는 재평가 작업이 자동 실행 중이라는 뜻은 아닙니다." };
            continue;
        }
        const evaluated = !v.artifact_only && !noFixedEvaluation;
        const evalText = noFixedEvaluation ? '고정 평가 미설정' :
            v.artifact_only ? '평가 결과 없음' : v.verified ? "검증됨" : "미검증 · 참고값";
        const video = videos[slot];
        const videoMatches = video && video.node_name === nodeName &&
            video.run_id === experiment && video.checkpoint === v.checkpoint &&
            (!v.checkpoint_sha256 || video.checkpoint_sha256 === v.checkpoint_sha256);
        // A factory, not nodes: the same cell is drawn in the wide table and in
        // the narrow-screen cards.
        column.cell = key => {
            if (key === "checkpoint") return v.checkpoint ? el("span", "mono", v.checkpoint) : missing();
            if (key === "iteration") return isNum(v.iteration) ? v.iteration.toLocaleString()
                : (v.iteration != null ? String(v.iteration) : missing());
            if (key === "reward") return evaluated ? fmt(v.reward) : missing(evalText);
            if (key === "vx") return evaluated ? fmt(v.vx_rmse) : missing(evalText);
            if (key === "evaluation") return statusTag(
                evaluated ? (v.verified ? "ok" : "warn") : "unk", evalText, "sm");
            if (videoMatches) {
                const button = el("button", "video-btn", "▶ 테스트 영상 보기");
                button.type = "button";
                button.onclick = () => openRankVideo(videos[slot], nodeName, title);
                return button;
            }
            if (video) return statusTag("warn", "영상 식별정보 불일치 · 재생 보류", "sm");
            const state = videoStatus(n, experiment, v.checkpoint);
            return statusTag(state.level, state.text, "sm");
        };
    }

    const rows = [
        ["Checkpoint", "checkpoint"], ["Iteration", "iteration"],
        ["Fixed-eval Reward", "reward"], ["VX RMSE", "vx"],
        ["평가", "evaluation"], ["테스트 영상", "video"],
    ];
    const table = el("table", "rank-table");
    const thead = el("thead");
    const headRow = el("tr");
    headRow.appendChild(el("th", "", ""));
    for (const column of columns) {
        const th = el("th");
        th.scope = "col";
        th.appendChild(el("span", "", column.title));
        th.appendChild(el("span", "desc", column.description));
        headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);
    const tbody = el("tbody");
    rows.forEach(([label, key], index) => {
        const tr = el("tr");
        const th = el("th", "", label);
        th.scope = "row";
        tr.appendChild(th);
        for (const column of columns) {
            if (column.unavailable) {
                if (index !== 0) continue;
                const td = el("td", "unavailable");
                td.rowSpan = rows.length;
                td.appendChild(statusTag(column.unavailable.level, column.unavailable.state, "sm"));
                td.appendChild(el("p", "card-note", column.unavailable.note));
                tr.appendChild(td);
                continue;
            }
            const td = el("td");
            const value = column.cell(key);
            if (value instanceof Node) td.appendChild(value);
            else td.textContent = value;
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    const wrap = el("div", "table-wrap rank-table-wrap");
    wrap.appendChild(table);
    host.appendChild(wrap);

    // Narrow screens: the same content as one card per slot, so no column
    // hides behind a horizontal scroll.
    const stack = el("div", "rank-cards");
    for (const column of columns) {
        const card = el("section", "card");
        card.appendChild(el("h3", "rank-card-title", column.title));
        card.appendChild(el("p", "card-note", column.description));
        if (column.unavailable) {
            card.appendChild(statusTag(column.unavailable.level, column.unavailable.state, "sm"));
            card.appendChild(el("p", "card-note", column.unavailable.note));
        } else {
            for (const [label, key] of rows) card.appendChild(row(label, column.cell(key)));
        }
        stack.appendChild(card);
    }
    host.appendChild(stack);
}

let latestDashboardData = null;
let refreshError = null;
let refreshErrorNetwork = false;
let lastSuccessAt = null;
let latestDataVersion = null;
const selectedRuns = {};

function nodeAvailability(data, name) {
    const health = (((data.health || {}).nodes || {})[name] || {});
    const elapsed = Math.max(0, Date.now() / 1000 - (data.generated_at || 0));
    const age = (health.heartbeat_age_sec ?? Infinity) + elapsed;
    if (refreshError) return refreshErrorNetwork
        ? {kind: "disconnected", text: "연결 끊김 · 상태 미확인"}
        : {kind: "refresh-failed", text: "갱신 실패 · 상태 미확인"};
    if (elapsed > 180) return {kind: "stale", text: "데이터 오래됨 · 상태 미확인"};
    if (health.status === "OFFLINE") return {kind: "offline", text: "오프라인 · 학습 상태 미확인"};
    // No heartbeat on record is "unknown", not proof the PC is down.
    if (health.heartbeat_age_sec == null) {
        return {kind: "no-heartbeat", text: "하트비트 정보 없음 · 상태 미확인"};
    }
    if (age > 60) return {kind: "offline", text: "오프라인 · 학습 상태 미확인"};
    return null;
}

function nodeState(data, name) {
    const n = (data.status || {})[name] || {};
    const running = !!(n.training || {}).running;
    const processCount = trainingProcesses(n).length;
    const availability = nodeAvailability(data, name);
    if (availability) {
        const offline = availability.kind === "offline";
        return { level: offline ? "err" : "warn", icon: offline ? "err" : "unk",
                 text: availability.text, stale: true };
    }
    if (processCount > 1) {
        return { level: "warn", icon: "warn", stale: false,
                 text: running ? "학습 " + processCount + "개 동시 실행" : "학습 중지됨" };
    }
    if (running) return { level: "ok", icon: "ok", text: "학습 중", stale: false };
    return { level: "err", icon: "stop", text: "학습 중지됨", stale: false };
}

function selectedRunProcess(data, nodeName) {
    const node = (data.status || {})[nodeName] || {};
    const current = primaryProcess(node);
    const selected = selectedRuns[nodeName];
    const completed = ((node.training || {}).completed_runs) || [];
    if (!selected) return current.experiment ? current : (completed[0] || current);
    if (selected === (current.experiment || {}).name) return current;
    return completed
        .find(p => (p.experiment || {}).name === selected) || {};
}

// Global reception state. Same thresholds as nodeAvailability: a failed
// refresh, or a publication older than 180 s.
function renderHeader(data) {
    const generatedAt = Number(data.generated_at);
    const age = Number.isFinite(generatedAt)
        ? Math.max(0, Date.now() / 1000 - generatedAt) : null;
    let level, text, iconKind, note = "";
    if (refreshError) {
        level = "err";
        text = refreshErrorNetwork ? "연결 끊김" : "갱신 실패";
        note = (refreshErrorNetwork ? "서버에 연결하지 못했습니다" : "데이터를 갱신하지 못했습니다") +
            " (" + refreshError + "). 화면의 값은 마지막으로 받은 데이터이며, 다음 확인 때 다시 시도합니다.";
    } else if (age === null) {
        level = "warn";
        iconKind = "unk";
        text = "게시 시각 미확인";
        note = "데이터에 게시 시각이 없어 최신 여부를 판단할 수 없습니다.";
    } else if (age > 180) {
        level = "warn";
        text = "데이터 오래됨";
        note = "새 데이터가 " + durationText(age) +
            " 동안 게시되지 않았습니다. 화면의 값은 마지막 게시 데이터입니다.";
    } else {
        level = "ok";
        text = "실시간 수신 중";
    }

    document.getElementById("conn").className = "conn " + level;
    const state = document.getElementById("connState");
    if (state.dataset.key !== level + "|" + text) {
        state.dataset.key = level + "|" + text;
        state.textContent = "";
        state.appendChild(statusTag(level, text, "lg", iconKind));
    }
    setText(document.getElementById("connPublished"), data.generated_at_text || "-");
    setText(document.getElementById("connAge"), age === null ? "" : "(" + ageText(age) + ")");
    setText(document.getElementById("connLast"), lastSuccessAt ? clockText(lastSuccessAt) : "-");
    setText(document.getElementById("connCycle"),
            Math.round(DASHBOARD_REFRESH_MS / 1000) + "초마다 확인");
    const noteBox = document.getElementById("connNote");
    setText(noteBox, note);
    noteBox.hidden = !note;
    renderAlertSummary(data);
}

function updateFreshness() {
    if (!latestDashboardData) return;
    renderHeader(latestDashboardData);
    // Only redraw status summaries: preserve an open video and run selection.
    const name = selectedNodeFromHash(latestDashboardData);
    if (!name) renderNodes(latestDashboardData);
    else renderDetailStatus(latestDashboardData, name);
}
setInterval(updateFreshness, 1000);

const DASHBOARD_REFRESH_MS = 30000;
let refreshPromise = null;

function selectedNodeFromHash(data) {
    if (!location.hash.startsWith("#node=")) return null;
    let name;
    try {
        name = decodeURIComponent(location.hash.slice(6));
    } catch (_) {
        return null;
    }
    return Object.prototype.hasOwnProperty.call(data.status || {}, name) ? name : null;
}

function navigateToNode(name) {
    const next = "#node=" + encodeURIComponent(name);
    if (location.hash === next && latestDashboardData) {
        renderDashboard(latestDashboardData);
    } else {
        location.hash = next;
    }
}

function navigateToOverview() {
    if (location.hash === "#overview" && latestDashboardData) {
        renderDashboard(latestDashboardData);
    } else {
        location.hash = "#overview";
    }
}

        }

    if(sim.control_url){

    section.appendChild(el("p","",sim.external_url?"외부 접속은 로그인 후 사용할 수 있습니다. 내부망에서는 내부망 접속 버튼을 이용하세요.":"실시간 실행은 PC·젯슨과 연결된 내부망에서 열립니다. 최근 결과는 이 대시보드에서도 확인할 수 있습니다."));
    const results=sim.results||{}, grouped=results.by_project?.[nodeName];

        if(project==="q1_two_point")section.appendChild(el("p","","Gazebo 전이 점검 — RaiSim 학습 결과를 대표하지 않습니다."));
        const p=result.policy||{},m=result.metrics||{};
        const states={completed:"완료",stopped:"사용자 종료",aborted:"중단",fault:"실행 중단"};
        const text="최근 실행: "+(states[result.status]||result.status)+" · "+(p.run||"")+" / "+(p.checkpoint||"")+" · "+new Date(result.started_at*1000).toLocaleString()+" · "+Number(result.elapsed||0).toFixed(1)+"초";
        section.appendChild(el("p","",text));
        if(result.error)section.appendChild(el("p","",result.error));
        if(m.vx_rmse!==undefined)section.appendChild(el("p","","속도 RMSE "+m.vx_rmse.toFixed(3)+" m/s · 회전 RMSE "+m.yaw_rmse.toFixed(3)+" rad/s"));
        const charts=el("div","sim-result-charts");section.appendChild(charts);BethexCharts.render(charts,result,true);
    }}
    if(!found){section.appendChild(el("p","","아직 이 PC 화면에서 실행한 시뮬레이션 결과가 없습니다."));}

function renderDetailHead(data, nodeName) {
    const host = document.getElementById("detailhead");
    host.textContent = "";

    const toolbar = el("nav", "toolbar");
    toolbar.setAttribute("aria-label", "화면 이동");
    const back = el("button", "tab", "← 전체 현황");
    back.type = "button";
    back.onclick = navigateToOverview;
    toolbar.appendChild(back);
    toolbar.appendChild(el("span", "sep"));

    const nav = el("div", "tabs");
    for (const name of Object.keys(data.status || {}).sort()) {
        const button = el("button", "tab", nodeLabel(name));
        button.type = "button";
        button.setAttribute("aria-label", nodeLabel(name) + " 상세 보기");
        if (name === nodeName) button.setAttribute("aria-current", "page");
        button.onclick = () => navigateToNode(name);
        nav.appendChild(button);
    }
    toolbar.appendChild(nav);

    const n = (data.status || {})[nodeName] || {};
    const picker = el("label", "run-select");
    picker.appendChild(el("span", "", "실험"));
    const selector = el("select");
    selector.setAttribute("aria-label", "실험 선택");
    const live = (primaryProcess(n).experiment || {}).name;
    selector.appendChild(el("option", "", live ? "현재 실행 · " + live : "최근 실행"));
    selector.children[0].value = "";
    for (const run of (data.runs || {})[nodeName] || []) {
        if (!run || run.experiment === live) continue;
        const option = el("option", "", run.experiment);
        option.value = run.experiment;
        selector.appendChild(option);
    }
    selector.value = selectedRuns[nodeName] || "";
    selector.onchange = () => {
        selectedRuns[nodeName] = selector.value;
        renderDashboard(latestDashboardData);
    };
    picker.appendChild(selector);
    toolbar.appendChild(picker);
    host.appendChild(toolbar);
    renderSimulationEntry(data, nodeName, host);

    const picked = selectedRuns[nodeName];
    if (picked && picked !== live) {
        host.appendChild(notice("info",
            "지난 실험 " + picked + " 을(를) 보고 있습니다. 지표·추이·랭킹은 선택한 실험 기준이고, " +
            "Running Processes와 PC 상태는 현재 기준입니다.", "run-note"));
    }
}

// Re-rendered every second, so it holds no focusable controls.
function renderDetailStatus(data, nodeName) {
    const host = document.getElementById("detailstatus");
    host.textContent = "";
    const n = (data.status || {})[nodeName] || {};
    const state = nodeState(data, nodeName);
    const box = el("section", "pc-strip " + state.level + (state.stale ? " is-stale" : ""));
    box.setAttribute("aria-label", nodeLabel(nodeName) + " 상태");

    const ident = el("div", "ident");
    ident.appendChild(el("h2", "pc-name", nodeLabel(nodeName)));
    if (nodeLabel(nodeName) !== nodeName) ident.appendChild(el("span", "pc-host", nodeName));
    ident.appendChild(statusTag(state.level, state.text, "pill", state.icon));
    box.appendChild(ident);

    const strip = el("dl", "strip");
    const item = (label, text) => {
        const wrap = el("div");
        wrap.appendChild(el("dt", "", label));
        const dd = el("dd");
        if (text === null || text === undefined || text === "") dd.appendChild(missing());
        else dd.textContent = text;
        wrap.appendChild(dd);
        strip.appendChild(wrap);
    };
    item("하트비트", heartbeatText(data, nodeName, true));
    item("Hostname", n.hostname);
    item("CPU", percentText(n.cpu_percent));
    item("RAM", percentText(n.ram_percent));
    const gpus = n.gpus || [];
    const g = gpus[0] || {};
    item(gpus.length > 1 ? "GPU (1/" + gpus.length + ")" : "GPU", g.name);
    item("VRAM", vramText(g));
    item("GPU 온도", isNum(g.temperature) ? g.temperature + " °C" : null);
    box.appendChild(strip);

    if (state.stale) {
        box.appendChild(notice(state.level,
            "표시된 값은 마지막으로 받은 값입니다. 현재 상태는 확인되지 않았습니다."));
    }
    host.appendChild(box);
}

function renderRunningProcesses(data, nodeName) {
    const host = document.getElementById("jobs");
    host.textContent = "";

    const n = (data.status || {})[nodeName] || {};
    const processes = trainingProcesses(n);
    const primary = primaryProcess(n);

    const head = el("div", "section-h");
    head.appendChild(el("h2", "", "Running Processes"));
    head.appendChild(el("span", "sub", "현재 실행 기준"));
    const tools = el("div", "tools");
    tools.appendChild(processes.length > 1
        ? statusTag("warn", "동시 실행 " + processes.length + "개", "pill")
        : el("span", "badge", String(processes.length)));
    head.appendChild(tools);
    host.appendChild(head);

    if (!processes.length) {
        host.appendChild(el("div", "card empty-card", "실행 중인 학습 프로세스가 없습니다."));
        return;
    }

    if (processes.length > 1) {
        host.appendChild(notice("warn",
            "주의: 동일 PC에서 학습 " + processes.length +
            "개가 동시에 실행 중입니다. 각 PID와 실험명을 확인하세요.", "concurrent-notice"));
    }

    const list = el("div", "process-list");
    for (const process of processes) {
        list.appendChild(processItem(process, process === primary));
    }
    host.appendChild(list);
}

let lastView = null;

function renderDashboard(data) {
    latestDashboardData = data;
    const nodeName = selectedNodeFromHash(data);
    const overview = document.getElementById("overview");
    const detail = document.getElementById("detail");
    const view = nodeName ? "node:" + nodeName : "overview";
    document.getElementById("app").dataset.view = nodeName ? "detail" : "overview";
    document.getElementById("crumb").textContent =
        nodeName ? nodeLabel(nodeName) + " 상세" : "전체 현황";
    document.title = (nodeName ? nodeLabel(nodeName) + " · " : "") + "RL Experiment Supervisor";

    if (nodeName) {
        overview.style.display = "none";
        detail.style.display = "";
        renderDetailHead(data, nodeName);
        renderDetailStatus(data, nodeName);
        renderRunningProcesses(data, nodeName);
        renderRunConfig(data, nodeName);
        renderMetrics(data, nodeName);
        renderHistory(data, nodeName);
        renderRanking(data, nodeName);
    } else {
        detail.style.display = "none";
        overview.style.display = "";
        renderNodes(data);
        renderAlerts(data);
    }
    renderHeader(data);
    // Switching screens starts at the top; data refreshes keep the position.
    if (lastView !== null && lastView !== view) window.scrollTo(0, 0);
    lastView = view;
}

window.addEventListener("hashchange", () => {
    if (latestDashboardData) renderDashboard(latestDashboardData);
});

document.getElementById("alertSummary").onclick = () => {
    const reveal = () => document.getElementById("alertbox").scrollIntoView({ block: "start" });
    if (latestDashboardData && selectedNodeFromHash(latestDashboardData)) {
        navigateToOverview();
        setTimeout(reveal, 50);
    } else {
        reveal();
    }
};

let passphrase = sessionStorage.getItem("rl_pass") || "";

function responseVersion(response) {
    return [response.headers.get("etag") || "",
            response.headers.get("last-modified") || "",
            response.headers.get("content-length") || ""].join("|");
}

// fetch() only rejects when no response arrived at all. Tag that case so the
// header can say "연결 끊김" rather than a generic refresh failure.
async function fetchResponse(url, options) {
    try {
        return await fetch(url, options);
    } catch (error) {
        const disconnected = new Error("서버 응답 없음 · " + error.message);
        disconnected.network = true;
        throw disconnected;
    }
}

async function load() {
    // Poll with a tiny metadata request.  The encrypted payload is several MB,
    // so downloading, parsing and decrypting it every 30 seconds when nothing
    // changed made an open dashboard progressively expensive.
    if (latestDataVersion) {
        const probe = await fetchResponse("data.json", {method: "HEAD", cache: "no-store"});
        if (!probe.ok) throw new Error("data.json 상태를 확인하지 못했습니다 (" + probe.status + ")");
        const probedVersion = responseVersion(probe);
        if (probedVersion && probedVersion === latestDataVersion) {
            lastSuccessAt = Date.now();
            refreshError = null;
            refreshErrorNetwork = false;
            updateFreshness();
            return latestDashboardData;
        }
    }

    const res = await fetchResponse("data.json", { cache: "no-store" });
    if (!res.ok) throw new Error("data.json 을 불러오지 못했습니다 (" + res.status + ")");
    const envelope = await res.json();
    const data = await decrypt(envelope, passphrase);
    latestDataVersion = responseVersion(res);
    latestEnvelope = envelope;
    lastSuccessAt = Date.now();
    refreshError = null;
    refreshErrorNetwork = false;
    renderDashboard(data);
}

function refreshDashboard() {
    if (!passphrase || refreshPromise) return refreshPromise;
    refreshPromise = load()
        .catch(error => {
            // WebCrypto failures can carry an empty message; never let a
            // failed refresh look like a successful one.
            refreshError = error.message || error.name || "알 수 없는 오류";
            refreshErrorNetwork = !!error.network;
            updateFreshness();
        })
        .finally(() => { refreshPromise = null; });
    return refreshPromise;
}

async function open_() {
    const err = document.getElementById("err");
    err.textContent = "복호화 중...";
    passphrase = document.getElementById("pass").value;
    try {
        await load();
        sessionStorage.setItem("rl_pass", passphrase);
        document.getElementById("gate").style.display = "none";
        document.getElementById("app").style.display = "";
        // The publisher runs at most once a minute. Polling every 30 seconds
        // catches the next deployment quickly, while refreshPromise prevents
        // overlapping decryptions on slow devices.
        setInterval(refreshDashboard, DASHBOARD_REFRESH_MS);
    } catch (e) {
        // A wrong passphrase fails the GCM tag check, which lands here.
        err.textContent = e && e.network
            ? "서버에 연결할 수 없습니다. 네트워크 연결을 확인한 뒤 다시 시도하세요."
            : "암호가 틀렸거나 데이터를 읽을 수 없습니다.";
        sessionStorage.removeItem("rl_pass");
    }
}

document.getElementById("go").onclick = open_;
document.getElementById("pass").addEventListener("keydown", e => {
    if (e.key === "Enter") open_();
});

// Background tabs throttle timers. Refresh immediately when the dashboard is
// brought back instead of leaving the last training session visible until the
// next interval happens to fire.
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshDashboard();
});
window.addEventListener("focus", refreshDashboard);

if (passphrase) {
    document.getElementById("pass").value = passphrase;
    open_();
}
</script>
</body>
</html>
