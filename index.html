<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RL Experiment Supervisor</title>
<style>
:root {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2129;
    --control: #21262d;
    --control-hover: #30363d;
    --line: #30363d;
    --line-soft: #21262d;
    --ink: #e6edf3;
    --ink-2: #c9d1d9;
    --muted: #8b949e;
    /* Status colors always travel with an icon and a text label: green and
       amber are not distinguishable for protan/deutan viewers on their own. */
    --ok: #3fb950;
    --warn: #d29922;
    --err: #f85149;
    --ok-bg: rgba(63, 185, 80, 0.10);
    --warn-bg: rgba(210, 153, 34, 0.10);
    --err-bg: rgba(248, 81, 73, 0.10);
    --ok-line: rgba(63, 185, 80, 0.45);
    --warn-line: rgba(210, 153, 34, 0.55);
    --err-line: rgba(248, 81, 73, 0.55);
    /* Interactive accent, and the single data-series color (never a status). */
    --accent: #58a6ff;
    --accent-bg: #111923;
    --chart: #388bfd;
    --chart-track: #1f2d45;
    --sans: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo",
            "Malgun Gothic", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 var(--sans);
}
button, input, select { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.93em; }
/* A value that was never collected. Kept visually distinct from a real 0. */
.na { color: var(--muted); font-style: italic; font-weight: 400; }

.shell { max-width: 1600px; margin: 0 auto; padding: 0 24px; }
#app[data-view="overview"] .shell { max-width: 1240px; }

/* ---- Header and data-reception status (both screens) ---- */
.topbar { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px;
          padding: 18px 0 12px; }
.topbar h1 { font-size: 18px; }
.crumb { color: var(--muted); font-size: 13px; }
.conn-bar { background: var(--bg); }
#app[data-view="detail"] .conn-bar { position: sticky; top: 0; z-index: 20;
                                     padding-bottom: 8px; }
.conn { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px;
        padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); }
.conn.ok { border-color: var(--ok-line);
           background: linear-gradient(var(--ok-bg), var(--ok-bg)), var(--surface); }
.conn.warn { border-color: var(--warn-line);
             background: linear-gradient(var(--warn-bg), var(--warn-bg)), var(--surface); }
.conn.err { border-color: var(--err-line);
            background: linear-gradient(var(--err-bg), var(--err-bg)), var(--surface); }
#app[data-view="detail"] .conn { padding: 8px 14px; }
.conn-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2);
             font-size: 13px; }
.conn-meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.conn-meta .age { font-variant-numeric: tabular-nums; }
.conn-note { flex-basis: 100%; color: var(--ink-2); font-size: 12px; }
.alert-summary { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 12px;
                 margin-left: auto; padding: 5px 10px; border: 1px solid var(--line);
                 border-radius: 8px; background: var(--control); color: var(--ink-2);
                 font-size: 12px; font-weight: 600; }
.alert-summary:hover { background: var(--control-hover); }

/* ---- Status tag: icon + text + color ---- */
.icon { width: 16px; height: 16px; flex: none; }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 700;
      white-space: nowrap; }
.st.ok { color: var(--ok); }
.st.warn { color: var(--warn); }
.st.err { color: var(--err); }
.st.unk { color: var(--muted); }
.st.lg { font-size: 16px; }
.st.lg .icon { width: 20px; height: 20px; }
.st.sm { font-size: 12px; font-weight: 600; white-space: normal; }
.st.sm .icon { width: 14px; height: 14px; }
.st.pill { padding: 3px 10px; border: 1px solid currentColor; border-radius: 999px;
           font-size: 12px; }
.st.pill .icon { width: 14px; height: 14px; }
.st.pill.ok { background: var(--ok-bg); }
.st.pill.warn { background: var(--warn-bg); }
.st.pill.err { background: var(--err-bg); }

/* ---- Shared blocks ---- */
.section-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px;
             margin: 28px 0 10px; min-width: 0; }
.section-h h2 { font-size: 16px; }
.section-h .sub { min-width: 0; max-width: 100%; overflow: hidden; color: var(--muted);
                  font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.section-h .tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
                    margin-left: auto; }
.badge { padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px;
         color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
       background: var(--control); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.btn:hover { background: var(--control-hover); }
.btn.danger { color: #ff7b72; }
.card { min-width: 0; padding: 14px 16px; background: var(--surface);
        border: 1px solid var(--line); border-radius: 10px; }
.empty-card { color: var(--muted); text-align: center; padding: 26px 18px; }
.card-note { margin: 8px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.note { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
        border-radius: 8px; font-size: 13px; line-height: 1.5; }
.note .icon { margin-top: 2px; }
.note.warn { color: var(--warn); background: var(--warn-bg); }
.note.err { color: var(--err); background: var(--err-bg); }
.note.info { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }
.metric { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
          min-width: 0; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.metric:last-child { border-bottom: none; }
.metric .label { min-width: 0; overflow: hidden; color: var(--muted);
                 text-overflow: ellipsis; white-space: nowrap; }
.metric .value { min-width: 0; overflow: hidden; font-weight: 600; text-align: right;
                 text-overflow: ellipsis; white-space: nowrap;
                 font-variant-numeric: tabular-nums; }
.metric .value.mono { font-weight: 500; }
.meter { height: 8px; overflow: hidden; border-radius: 4px; background: var(--chart-track); }
.meter > i { display: block; height: 100%; border-radius: 4px; background: var(--chart); }

/* ---- Overview: one card per PC ---- */
.pc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
           gap: 16px; margin-top: 16px; }
.pc-card { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 20px;
           background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.pc-card.warn { border-color: var(--warn-line); }
.pc-card.err { border-color: var(--err-line); }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pc-name { font-size: 24px; font-weight: 800; line-height: 1.1; }
.pc-host { margin-top: 4px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
.pc-state { display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
            min-width: 0; text-align: right; }
.pc-state .st { white-space: normal; }
.pc-hb { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.pc-exp { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pc-exp .k { color: var(--muted); font-size: 12px; }
.pc-exp .v { overflow: hidden; font-family: var(--mono); font-size: 13px;
             text-overflow: ellipsis; white-space: nowrap; }
.pc-progress .line { display: flex; justify-content: space-between; align-items: baseline;
                     gap: 10px; margin-bottom: 8px; }
.pc-progress .pct { font-size: 32px; font-weight: 700; line-height: 1.1; }
.pc-progress .pct.na { font-size: 15px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px;
         margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { min-width: 0; margin: 0; font-weight: 600; text-align: right;
            overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.pc-others { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.pc-others .k { color: var(--muted); font-size: 12px; }
.pc-other { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.pc-other .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-other b { flex: none; font-variant-numeric: tabular-nums; }
.pc-empty { padding: 4px 0; color: var(--muted); }
.sys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px;
       margin: 0; padding-top: 14px; border-top: 1px solid var(--line-soft); }
.sys dt { color: var(--muted); font-size: 12px; }
.sys dd { margin: 2px 0 0; font-size: 18px; font-weight: 700;
          font-variant-numeric: tabular-nums; }
.sys dd .unit { color: var(--muted); font-size: 12px; font-weight: 500; }
.sys dd .na { font-size: 14px; }
.sys .meter { height: 4px; margin-top: 6px; }
.is-stale .pc-progress .pct, .is-stale .facts dd, .is-stale .sys dd,
.is-stale .strip dd, .is-stale .pc-other b { color: var(--muted); }
.is-stale .meter > i { background: #3a4a63; }
.cta { width: 100%; margin-top: auto; padding: 10px; border: 1px solid var(--accent);
       border-radius: 8px; background: var(--accent-bg); color: var(--accent);
       font-weight: 700; }
.cta:hover { background: #16233a; }

/* ---- Alerts ---- */
.alert-list { overflow: hidden; background: var(--surface); border: 1px solid var(--line);
              border-radius: 10px; }
.alert-item { display: grid; grid-template-columns: 116px minmax(0, 1fr) auto; gap: 12px;
              align-items: start; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.alert-item:last-child { border-bottom: none; }
.alert-item.unread { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
.alert-item.read > :not(.alert-actions) { opacity: 0.7; }
.alert-level { font-size: 13px; text-transform: uppercase; }
.alert-message { line-height: 1.5; overflow-wrap: anywhere; }
.alert-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; color: var(--muted);
              font-size: 12px; }
.alert-actions { display: flex; gap: 6px; }
.alert-empty { padding: 18px; color: var(--muted); text-align: center; }

/* ---- Detail: one PC ---- */
.toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
       background: var(--control); color: var(--ink-2); font-size: 13px; font-weight: 700; }
.tab:hover { background: var(--control-hover); }
.tab[aria-current="page"] { border-color: var(--accent); background: var(--accent-bg);
                            color: var(--accent); }
.toolbar .sep { width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
.run-select { display: flex; align-items: center; gap: 8px; min-width: 0; margin-left: auto;
              color: var(--muted); font-size: 12px; }
.run-select select { min-width: 0; max-width: 460px; padding: 6px 8px;
                     border: 1px solid var(--line); border-radius: 6px;
                     background: var(--control); color: var(--ink); font-size: 13px; }
.run-note { margin-bottom: 12px; }
.pc-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px;
            padding: 12px 16px; background: var(--surface); border: 1px solid var(--line);
            border-radius: 10px; }
.pc-strip.warn { border-color: var(--warn-line); }
.pc-strip.err { border-color: var(--err-line); }
.pc-strip .ident { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
.pc-strip .pc-name { font-size: 22px; }
.pc-strip .st.pill { align-self: center; }
.pc-strip .note { flex-basis: 100%; }
.strip { display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 0; }
.strip dt { color: var(--muted); font-size: 11px; }
.strip dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.detail-top { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
              gap: 0 16px; align-items: start; }
.process-list { display: flex; flex-direction: column; gap: 12px; }
.concurrent-notice { margin-bottom: 12px; }
.process-item { min-width: 0; padding: 14px 16px; background: var(--surface);
                border: 1px solid var(--line); border-radius: 10px; }
.process-item.primary { border-color: rgba(88, 166, 255, 0.45); }
.process-head { display: flex; align-items: center; justify-content: space-between;
                gap: 8px; margin-bottom: 6px; }
.process-name { min-width: 0; overflow: hidden; font-weight: 700; text-overflow: ellipsis;
                white-space: nowrap; }
.role { flex: none; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px;
        color: var(--muted); font-size: 11px; font-weight: 700; }
.role.primary { border-color: rgba(88, 166, 255, 0.6); background: var(--accent-bg);
                color: var(--accent); }
.process-rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                column-gap: 28px; }
.process-rows .span { grid-column: 1 / -1; }
.process-rows .meter { height: 6px; margin: 0 0 6px; }
.metric-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                 gap: 6px 32px; }
.metric-group { min-width: 0; }
.metric-group h3 { margin: 6px 0 2px; color: var(--muted); font-size: 12px; font-weight: 700; }

/* ---- Charts: small multiples, one series each ---- */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
              gap: 12px; }
.chart { min-width: 0; margin: 0; padding: 12px 12px 8px; background: var(--surface);
         border: 1px solid var(--line); border-radius: 10px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-label { min-width: 0; overflow: hidden; color: var(--ink-2); font-size: 13px;
               text-overflow: ellipsis; white-space: nowrap; }
.chart-last { flex: none; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart-area { position: relative; margin-top: 6px; }
.chart-plot { border-radius: 4px; touch-action: pan-y; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round;
              stroke-linecap: round; vector-effect: non-scaling-stroke; }
.chart-zero { stroke: #484f58; stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart-dot { fill: var(--chart); }
.chart-end { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart-cross line { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart-cross circle { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.chart-axis, .chart-foot { display: flex; justify-content: space-between; flex-wrap: wrap;
                           gap: 2px 10px; color: var(--muted); font-size: 11px;
                           font-variant-numeric: tabular-nums; }
.chart-readout { position: absolute; top: -2px; padding: 1px 6px; border: 1px solid var(--line);
                 border-radius: 4px; background: var(--surface-2); color: var(--ink);
                 font-size: 11px; white-space: nowrap; pointer-events: none;
                 font-variant-numeric: tabular-nums; }
.chart-readout:empty { opacity: 0; }
.chart-data summary { width: max-content; margin-top: 6px; color: var(--muted);
                      font-size: 11px; cursor: pointer; }
.chart-table-wrap { max-height: 180px; margin-top: 6px; overflow: auto;
                    border-top: 1px solid var(--line-soft); }
.chart-table { width: 100%; border-collapse: collapse; font-size: 12px;
               font-variant-numeric: tabular-nums; }
.chart-table th, .chart-table td { padding: 3px 6px; text-align: right;
                                   border-bottom: 1px solid var(--line-soft); }
.chart-table th { position: sticky; top: 0; background: var(--surface); color: var(--muted);
                  font-weight: 600; }

/* ---- Checkpoint ranking: one comparison table ---- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line);
              border-radius: 10px; }
.rank-notice { margin-bottom: 10px; }
.rank-table { width: 100%; min-width: 620px; border-collapse: collapse; }
.rank-table th, .rank-table td { padding: 9px 14px; text-align: left; vertical-align: top;
                                 border-bottom: 1px solid var(--line-soft); }
.rank-table tbody tr:last-child > * { border-bottom: none; }
.rank-table thead th { background: #11161d; font-size: 12px; }
.rank-table thead .desc { display: block; margin-top: 2px; color: var(--muted);
                          font-weight: 400; }
.rank-table tbody th { width: 150px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.rank-table th:first-child { position: sticky; left: 0; background: var(--surface); }
.rank-table thead th:first-child { background: #11161d; }
.rank-table td { font-variant-numeric: tabular-nums; }
.rank-table td.unavailable { vertical-align: middle; border-left: 1px solid var(--line-soft);
                             border-bottom: none; }
.rank-table td.unavailable .card-note { max-width: 320px; }
.rank-cards { display: none; }
.rank-card-title { font-size: 13px; }
.rank-cards .card-note { margin: 2px 0 8px; }
.video-btn { padding: 6px 12px; border: 1px solid var(--accent); border-radius: 6px;
             background: var(--accent-bg); color: var(--accent); font-size: 12px;
             font-weight: 700; }
.video-btn:hover { background: #16233a; }

/* ---- Passphrase gate ---- */
#gate { max-width: 380px; margin: 12vh auto; padding: 0 16px; }
#gate h1 { margin-bottom: 4px; font-size: 20px; }
#gate .sub { margin-bottom: 18px; color: var(--muted); font-size: 13px; }
#pass { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--bg); color: var(--ink); font-size: 14px; }
#go { width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 8px;
      background: #1f6feb; color: #fff; font-size: 14px; font-weight: 600; }
#err { min-height: 18px; margin-top: 12px; color: var(--err); }

/* ---- Test video modal ---- */
.video-modal { position: fixed; inset: 0; z-index: 1000; padding: 24px;
               display: grid; place-items: center;
               background: rgba(1, 4, 9, 0.86); }
.video-dialog { width: min(960px, 100%); max-height: calc(100vh - 48px);
                overflow: hidden; padding: 18px; background: var(--surface);
                border: 1px solid var(--line); border-radius: 12px;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55); }
.video-head { display: flex; align-items: flex-start; justify-content: space-between;
              gap: 16px; margin-bottom: 12px; }
.video-head .btn { flex: none; white-space: nowrap; }
.video-title { font-size: 15px; font-weight: 700; }
.video-meta { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.5;
              overflow-wrap: anywhere; }
.video-stage { position: relative; width: 100%; aspect-ratio: 16 / 9;
               overflow: hidden; background: #010409; border-radius: 8px; }
.video-player { position: absolute; inset: 0; display: block; width: 100%;
                height: 100%; object-fit: contain; background: #010409; }
.video-status { position: absolute; inset: 0; z-index: 2; display: grid;
                place-items: center; padding: 24px; color: var(--muted);
                text-align: center; background: #010409; }

@media (max-width: 1000px) {
    .detail-top { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
    .shell { padding: 0 14px; }
    #app[data-view="detail"] .conn-bar { position: static; }
    .pc-grid { grid-template-columns: minmax(0, 1fr); }
    .pc-card { padding: 16px; }
    .sys dd { font-size: 16px; }
    /* One column: let long values (experiment names, sources) wrap instead of
       truncating them. */
    .metric .label { flex: none; max-width: 48%; }
    .metric .value { white-space: normal; overflow-wrap: anywhere; }
    .rank-table-wrap { display: none; }
    .rank-cards { display: grid; gap: 12px; }
    .alert-summary { margin-left: 0; }
    .alert-item { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .alert-actions { justify-content: flex-end; }
    .process-rows { grid-template-columns: minmax(0, 1fr); }
    .toolbar .sep { display: none; }
    .run-select { width: 100%; margin-left: 0; }
    .run-select select { flex: 1; max-width: none; }
}

.sim-entry { margin: 18px 0; padding: 20px; border: 1px solid #30363d; border-radius: 10px; background: #161b22; }
.sim-entry-head { display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap }
.sim-entry-head h2 {margin:0;font-size:18px}.sim-entry p{font-size:13px;color:#8b949e;margin:10px 0}
.sim-link {display:inline-block;padding:10px 16px;background:#238636;border:1px solid #2ea043;border-radius:6px;color:white;text-decoration:none;font-size:14px}
.sim-result-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.sim-result-charts .chart-card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;min-width:0}

/* Dependency-free SVG charts, shared by the live and encrypted static dashboards. */
window.BethexCharts = (() => {
 const NS='http://www.w3.org/2000/svg';
 function element(tag, attrs={}, text) {const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(text!==undefined)e.textContent=text;return e;}
 function chart(host, result, title, lines, xy=false) {
  const rows=(result.series||[]).filter(r=>r.every(Number.isFinite));if(!rows.length)return;
  const box=document.createElement('div');box.className='chart-card';

  const legend=document.createElement('div');legend.className='legend';
  lines.forEach(line=>{const item=document.createElement('span'),swatch=document.createElement('i');swatch.style.background=line.color;item.append(swatch,document.createTextNode(line.label));legend.appendChild(item);});box.appendChild(legend);
  const W=620,H=250,L=52,R=14,T=22,B=35;
  let xmin=Math.min(...rows.map(r=>r[xy?7:0])),xmax=Math.max(...rows.map(r=>r[xy?7:0]));
  let vals=rows.flatMap(r=>lines.map(line=>r[line.column]));let ymin=Math.min(0,...vals),ymax=Math.max(0,...vals);
  if(xmax-xmin<.001)xmax=xmin+1;

  if(xy){let span=Math.max(xmax-xmin,(ymax-ymin)*(W-L-R)/(H-T-B));let mid=(xmax+xmin)/2;xmin=mid-span/2;xmax=mid+span/2;const yspan=span*(H-T-B)/(W-L-R),ymid=(ymax+ymin)/2;ymin=ymid-yspan/2;ymax=ymid+yspan/2;}
  const x=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R),y=v=>H-B-(v-ymin)/(ymax-ymin)*(H-T-B);

  if(!xy) (result.events||[]).forEach((event,i,all)=>{if(event.t>xmax)return;const end=all[i+1]?.t??xmax;svg.appendChild(element('rect',{x:x(event.t),y:T,width:Math.max(0,x(Math.min(end,xmax))-x(event.t)),height:H-T-B,fill:i%2?'#58a6ff0b':'#ffffff05'}));svg.appendChild(element('text',{x:x(event.t)+3,y:13,fill:'#8b949e','font-size':9},event.name));});
  for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4;svg.appendChild(element('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:'#30363d','stroke-width':.7}));svg.appendChild(element('text',{x:L-7,y:y(v)+4,'text-anchor':'end',fill:'#8b949e','font-size':10},v.toFixed(2)));}
  for(let i=0;i<=5;i++){const v=xmin+(xmax-xmin)*i/5;svg.appendChild(element('text',{x:x(v),y:H-14,'text-anchor':'middle',fill:'#8b949e','font-size':10},v.toFixed(1)));}
  lines.forEach(line=>{const d=rows.map((r,i)=>(i?'L':'M')+x(r[xy?7:0]).toFixed(2)+','+y(r[line.column]).toFixed(2)).join(' ');svg.appendChild(element('path',{d,fill:'none',stroke:line.color,'stroke-width':1.7,...(line.dashed?{'stroke-dasharray':'5 3'}:{})}));});

  box.appendChild(svg);host.appendChild(box);
 }
 // Support-force columns 9..12 = telemetry [13..16]. result.support_labels (from the server) wins; a falsy entry skips that column.

  q1_two_point:['왼쪽 구동바퀴','오른쪽 구동바퀴','바퀴 외 접촉']};
 const DEFAULT_SUPPORT=['왼쪽 보조바퀴','오른쪽 보조바퀴','왼쪽 구동바퀴','오른쪽 구동바퀴'];
 const SUPPORT_COLORS={'왼쪽 구동바퀴':'#58a6ff','오른쪽 구동바퀴':'#3fb950','바퀴 외 접촉':'#ff7b72'},PALETTE=['#f2cc60','#ff7b72','#58a6ff','#3fb950'];
 function supportLines(result){
  const given=Array.isArray(result?.support_labels)?result.support_labels.slice(0,4):null;
  const labels=given&&given.some(label=>typeof label==='string'&&label)?given:SUPPORT_LABELS[result?.project||result?.policy?.project]||DEFAULT_SUPPORT;
  return labels.map((label,i)=>typeof label==='string'&&label?{column:9+i,color:SUPPORT_COLORS[label]||PALETTE[i],label}:null).filter(Boolean);
 }
 function render(host,result,compact=false){host.textContent='';if(!result)return;
  chart(host,result,'전진 속도 · m/s',[{column:1,color:'#d2a8ff',label:'목표',dashed:true},{column:2,color:'#58a6ff',label:'실제'}]);
  chart(host,result,'회전 속도 · rad/s',[{column:3,color:'#d2a8ff',label:'목표',dashed:true},{column:4,color:'#3fb950',label:'실제'}]);
  if(compact)return;
  chart(host,result,'몸체 기울기 · °',[{column:5,color:'#58a6ff',label:'롤'},{column:6,color:'#f2cc60',label:'피치'}]);
  chart(host,result,'이동 경로 · Y [m]',[{column:8,color:'#3fb950',label:'실제 경로'}],true);
  const load=supportLines(result);if(load.length)chart(host,result,load.every(line=>/바퀴$/.test(line.label))?'바퀴 수직 접촉 하중 · N':'수직 접촉 하중 · N',load);

})();


// The payload is AES-256-GCM under a PBKDF2-HMAC-SHA256 key, produced by
// rl_publish.py on the Jetson. Parameters travel with the blob so they can be
// changed there without editing this page.
// 600k PBKDF2 iterations is deliberately slow — that is the point on the
// attacker's side. Re-deriving on every auto-refresh would just burn the
// viewer's CPU for nothing, so cache per (salt, iterations). The salt only
// changes when the Jetson re-encrypts with fresh randomness.
let keyCache = { id: null, key: null };
let latestEnvelope = null;

function decodeBase64(s) {
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function decryptionKey(blob, passphrase) {
    const id = blob.salt + ":" + blob.iterations + ":" + passphrase;
    let key = keyCache.id === id ? keyCache.key : null;

    if (!key) {
        const base = await crypto.subtle.importKey(
            "raw", new TextEncoder().encode(passphrase),
            "PBKDF2", false, ["deriveKey"]);

        key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: decodeBase64(blob.salt),
              iterations: blob.iterations, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

        keyCache = { id: id, key: key };
    }
    return key;
}

async function decrypt(blob, passphrase) {
    const key = await decryptionKey(blob, passphrase);

    // Python's AESGCM appends the 16-byte tag, which is what AES-GCM decrypt
    // expects by default here.
    const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decodeBase64(blob.iv) },
        key, decodeBase64(blob.data));

    let decoded = new Uint8Array(plain);
    if (blob.compression === "gzip") {
        if (typeof DecompressionStream !== "function") {
            throw new Error("이 브라우저는 압축된 대시보드 데이터를 지원하지 않습니다.");
        }
        const stream = new Blob([decoded]).stream()
            .pipeThrough(new DecompressionStream("gzip"));
        decoded = new Uint8Array(await new Response(stream).arrayBuffer());
    } else if (blob.compression) {
        throw new Error("지원하지 않는 데이터 압축 형식입니다: " + blob.compression);
    }

    return JSON.parse(new TextDecoder().decode(decoded));
}

function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
}

// Timers rewrite the header every second; only touch text that changed so
// assistive tech does not re-announce identical content.
function setText(node, text) {
    if (node.textContent !== text) node.textContent = text;
}

function isNum(v) {
    return typeof v === "number" && Number.isFinite(v);
}

const ICON_SHAPES = {
    ok: [["circle", {cx: 8, cy: 8, r: 6.8}], ["path", {d: "M5 8.3l2 2 4-4.4"}]],
    warn: [["path", {d: "M8 1.8l6.6 12H1.4z"}], ["path", {d: "M8 6.2v3.4"}],
           ["circle", {cx: 8, cy: 11.8, r: 0.9, fill: "currentColor", stroke: "none"}]],
    err: [["circle", {cx: 8, cy: 8, r: 6.8}],
          ["path", {d: "M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8"}]],
    stop: [["circle", {cx: 8, cy: 8, r: 6.8}],
           ["rect", {x: 5.5, y: 5.5, width: 5, height: 5, rx: 0.8,
                     fill: "currentColor", stroke: "none"}]],
    unk: [["circle", {cx: 8, cy: 8, r: 6.8, "stroke-dasharray": "2.4 2"}],
          ["path", {d: "M6.3 6.3a1.8 1.8 0 1 1 2.6 1.6c-.6.3-.9.7-.9 1.4"}],
          ["circle", {cx: 8, cy: 11.6, r: 0.9, fill: "currentColor", stroke: "none"}]],
    info: [["circle", {cx: 8, cy: 8, r: 6.8}], ["path", {d: "M8 7.3v4"}],
           ["circle", {cx: 8, cy: 4.9, r: 0.9, fill: "currentColor", stroke: "none"}]],
};
const STATUS_ICONS = { ok: "ok", warn: "warn", err: "err", unk: "unk", info: "info" };

function icon(kind) {
    const svg = svgEl("svg", {
        viewBox: "0 0 16 16", class: "icon", "aria-hidden": "true", focusable: "false",
        fill: "none", stroke: "currentColor", "stroke-width": 1.7,
        "stroke-linecap": "round", "stroke-linejoin": "round" });
    for (const [tag, attrs] of ICON_SHAPES[kind] || ICON_SHAPES.unk) {
        svg.appendChild(svgEl(tag, attrs));
    }
    return svg;
}

// Normal / caution / error are never color alone: each carries a distinct
// icon shape (check, triangle, cross, dashed "?") plus its text.
function statusTag(level, text, extra, iconKind) {
    const tag = el("span", "st " + level + (extra ? " " + extra : ""));
    tag.appendChild(icon(iconKind || STATUS_ICONS[level] || "unk"));
    tag.appendChild(el("span", "", text));
    return tag;
}

function notice(level, text, extra) {
    const box = el("div", "note " + level + (extra ? " " + extra : ""));
    box.appendChild(icon(STATUS_ICONS[level] || "info"));
    box.appendChild(el("span", "", text));
    return box;
}

// A field that was never collected must not look like a measured 0.
function missing(text) {
    return el("span", "na", text || "없음");
}

let videoObjectUrl = null;
let videoGeneration = 0;
let videoAbort = null;

function closeRankVideo() {
    videoGeneration++;
    if (videoAbort) videoAbort.abort();
    videoAbort = null;
    const modal = document.getElementById("videoModal");
    const player = document.getElementById("videoPlayer");
    player.pause();
    player.removeAttribute("src");
    player.load();
    player.hidden = true;
    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
    videoObjectUrl = null;
    modal.hidden = true;
}

async function openRankVideo(meta, nodeName, rankTitle) {
    closeRankVideo();
    const generation = ++videoGeneration;
    videoAbort = new AbortController();
    const signal = videoAbort.signal;
    const envelope = latestEnvelope;
    const current = () => generation === videoGeneration && !signal.aborted;
    const modal = document.getElementById("videoModal");
    const status = document.getElementById("videoStatus");
    const player = document.getElementById("videoPlayer");
    document.getElementById("videoTitle").textContent =
        nodeLabel(nodeName) + " · " + rankTitle;
    document.getElementById("videoMeta").textContent =
        (meta.checkpoint || "-") + " · " + (meta.scenarios || []).join(" → ");
    player.pause();
    player.removeAttribute("src");
    player.load();
    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
    videoObjectUrl = null;
    status.textContent = "암호화된 영상을 불러와 복호화하는 중입니다…";
    status.hidden = false;
    player.hidden = true;
    modal.hidden = false;

    try {
        if (!envelope) throw new Error("암호화 정보가 없습니다.");
        if (meta.node_name !== nodeName) throw new Error("영상 노드 정보가 일치하지 않습니다.");
        const response = await fetch(
            meta.path + "?v=" + encodeURIComponent(meta.updated_at || ""),
            { cache: "no-store", signal });
        if (!current()) return;
        if (!response.ok) {
            throw new Error("영상 파일을 불러오지 못했습니다 (" + response.status + ")");
        }
        const key = await decryptionKey(envelope, passphrase);
        if (!current()) return;
        const plaintext = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: decodeBase64(meta.iv) },
            key, await response.arrayBuffer());
        if (!current() || modal.hidden) return;
        if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = URL.createObjectURL(
            new Blob([plaintext], { type: meta.mime || "video/mp4" }));
        player.src = videoObjectUrl;
        player.hidden = false;
        status.hidden = true;
        player.play().catch(() => {});
    } catch (error) {
        if (!current()) return;
        status.hidden = false;
        status.textContent = "영상을 열 수 없습니다: " + error.message;
    }
}

document.getElementById("videoClose").onclick = closeRankVideo;
document.getElementById("videoModal").addEventListener("click", event => {
    if (event.target.id === "videoModal") closeRankVideo();
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !document.getElementById("videoModal").hidden) {
        closeRankVideo();
    }
});

function row(label, value, cls) {
    const r = el("div", "metric");
    const l = el("span", "label", label);
    l.title = label;
    r.appendChild(l);
    const v = el("span", "value " + (cls || ""));
    if (value instanceof Node) {
        v.appendChild(value);
    } else {
        v.textContent = value;
        v.title = value;
    }
    r.appendChild(v);
    return r;
}

function fmt(v) {
    if (v === null || v === undefined) return "-";
    if (typeof v !== "number") return String(v);
    if (v === 0) return "0.00000";
    const a = Math.abs(v);
    if (a >= 10000 || a < 0.0001) return v.toExponential(3);
    return v.toFixed(5);
}

function durationText(seconds) {
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return s + "초";
    if (s < 3600) return Math.floor(s / 60) + "분 " + (s % 60) + "초";
    return Math.floor(s / 3600) + "시간 " + Math.floor((s % 3600) / 60) + "분";
}

function ageText(seconds) {
    return durationText(seconds) + " 전";
}

// Browser-local HH:MM:SS; the ko-KR locale would otherwise spell out 시/분/초.
function clockText(ms) {
    const t = new Date(ms);
    return [t.getHours(), t.getMinutes(), t.getSeconds()]
        .map(part => String(part).padStart(2, "0")).join(":");
}

function percentText(v) {
    return isNum(v) ? v.toFixed(1) + " %" : null;
}

function vramAmount(gpu) {
    if (!isNum(gpu.memory_used)) return null;
    return Math.round(gpu.memory_used).toLocaleString() +
        (isNum(gpu.memory_total) ? " / " + Math.round(gpu.memory_total).toLocaleString() : "");
}

function vramText(gpu) {
    const amount = vramAmount(gpu);
    return amount === null ? null : amount + " MiB";
}

function progressBar(percent, label) {
    const clamped = Math.max(0, Math.min(100, percent));
    const bar = el("div", "meter");
    const fill = el("i");
    fill.style.width = clamped + "%";
    bar.appendChild(fill);
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", "100");
    bar.setAttribute("aria-valuenow", clamped.toFixed(1));
    bar.setAttribute("aria-label", label);
    return bar;
}

const ALERT_STATE_KEY = "rl-dashboard-alert-state-v1";
let latestAlertData = null;

function loadAlertState() {
    try {
        const parsed = JSON.parse(localStorage.getItem(ALERT_STATE_KEY) || "{}");
        return {
            read: parsed.read && typeof parsed.read === "object" ? parsed.read : {},
            deleted: parsed.deleted && typeof parsed.deleted === "object"
                ? parsed.deleted : {},
        };
    } catch (_) {
        return { read: {}, deleted: {} };
    }
}

let alertState = loadAlertState();

function saveAlertState() {
    // Keep state bounded even if this dashboard runs for years.
    for (const key of ["read", "deleted"]) {
        const entries = Object.entries(alertState[key])
            .sort((a, b) => Number(b[1]) - Number(a[1]))
            .slice(0, 500);
        alertState[key] = Object.fromEntries(entries);
    }
    try {
        localStorage.setItem(ALERT_STATE_KEY, JSON.stringify(alertState));
    } catch (_) {
        // Private browsing/storage denial should not break monitoring.
    }
}

function fallbackAlertId(a) {
    const source = [a.ts, a.key, a.level, a.message].join("|");
    let hash = 2166136261;
    for (let i = 0; i < source.length; i++) {
        hash ^= source.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return "legacy-" + (hash >>> 0).toString(16);
}

function alertId(a) {
    return a.id || fallbackAlertId(a);
}

function alertButton(label, title, onClick, danger) {
    const button = el("button", "btn" + (danger ? " danger" : ""), label);
    button.type = "button";
    button.title = title;
    button.onclick = onClick;
    return button;
}

function rerenderAlerts() {
    if (latestAlertData) renderAlerts(latestAlertData);
    if (latestDashboardData) renderAlertSummary(latestDashboardData);
}

function activeAlerts(data) {
    return (data.alerts || [])
        .filter(a => a.level !== "resolved")
        .slice(-20)
        .reverse();
}

function alertStatusLevel(level) {
    return level === "critical" ? "err" : level === "warning" ? "warn" : "unk";
}

function renderAlerts(data) {
    latestAlertData = data;
    const box = document.getElementById("alertbox");
    box.textContent = "";

    const active = activeAlerts(data);
    const visible = active.filter(a => !alertState.deleted[alertId(a)]);
    const unread = visible.filter(a => !alertState.read[alertId(a)]).length;
    const deleted = active.length - visible.length;

    const header = el("div", "section-h");
    header.appendChild(el("h2", "", "알림"));
    header.appendChild(el("span", "sub", active.length
        ? "안 읽음 " + unread + " · 표시 " + visible.length
        : "활성 알림 없음"));
    box.appendChild(header);
    if (!active.length) return;

    const tools = el("div", "tools");
    if (unread) {
        tools.appendChild(alertButton("모두 읽음", "표시된 알림을 모두 읽음 처리", () => {
            const now = Date.now();
            for (const a of visible) alertState.read[alertId(a)] = now;
            saveAlertState();
            rerenderAlerts();
        }));
    }
    if (visible.some(a => alertState.read[alertId(a)])) {
        tools.appendChild(alertButton("읽은 알림 삭제", "읽음 처리한 알림을 화면에서 숨김", () => {
            const now = Date.now();
            for (const a of visible) {
                const id = alertId(a);
                if (alertState.read[id]) alertState.deleted[id] = now;
            }
            saveAlertState();
            rerenderAlerts();
        }, true));
    }
    if (deleted) {
        tools.appendChild(alertButton("삭제 복구 " + deleted, "삭제한 알림을 다시 표시", () => {
            for (const a of active) delete alertState.deleted[alertId(a)];
            saveAlertState();
            rerenderAlerts();
        }));
    }
    header.appendChild(tools);

    const list = el("div", "alert-list");
    if (!visible.length) {
        list.appendChild(el("div", "alert-empty", "표시할 알림이 없습니다."));
    }

    for (const a of visible) {
        const id = alertId(a);
        const isRead = !!alertState.read[id];
        const level = a.level || "warning";
        const item = el("article", "alert-item " + (isRead ? "read" : "unread"));
        item.dataset.alertId = id;
        item.appendChild(statusTag(alertStatusLevel(level), level, "alert-level"));

        const main = el("div", "alert-main");
        main.appendChild(el("div", "alert-message", a.message || "내용 없음"));
        const meta = el("div", "alert-meta");
        meta.appendChild(el("span", "", a.ts_text || "시간 미상"));
        meta.appendChild(el("span", "", isRead ? "읽음" : "안 읽음"));
        main.appendChild(meta);
        item.appendChild(main);

        const actions = el("div", "alert-actions");
        actions.appendChild(alertButton(
            isRead ? "안 읽음" : "읽음",
            isRead ? "이 알림을 안 읽음으로 표시" : "이 알림을 읽음 처리",
            () => {
                if (isRead) delete alertState.read[id];
                else alertState.read[id] = Date.now();
                saveAlertState();
                rerenderAlerts();
            }));
        actions.appendChild(alertButton("삭제", "이 브라우저에서 알림 숨기기", () => {
            alertState.deleted[id] = Date.now();
            saveAlertState();
            rerenderAlerts();
        }, true));
        item.appendChild(actions);
        list.appendChild(item);
    }
    box.appendChild(list);
}

function unreadAlertCounts(data) {
    const counts = { critical: 0, warning: 0, other: 0 };
    for (const a of activeAlerts(data)) {
        const id = alertId(a);
        if (alertState.deleted[id] || alertState.read[id]) continue;
        const level = a.level || "warning";
        if (level === "critical" || level === "warning") counts[level]++;
        else counts.other++;
    }
    return counts;
}

// Visible from both screens, so an unread alert is never hidden behind the
// detail view.
function renderAlertSummary(data) {
    const button = document.getElementById("alertSummary");
    const counts = unreadAlertCounts(data);
    const key = [counts.critical, counts.warning, counts.other].join("|");
    if (button.dataset.key === key) return;
    button.dataset.key = key;
    button.textContent = "";
    const total = counts.critical + counts.warning + counts.other;
    if (!total) {
        button.appendChild(el("span", "", "안 읽은 알림 없음"));
    } else {
        button.appendChild(el("span", "", "안 읽은 알림"));
        if (counts.critical) button.appendChild(statusTag("err", "CRITICAL " + counts.critical, "sm"));
        if (counts.warning) button.appendChild(statusTag("warn", "WARNING " + counts.warning, "sm"));
        if (counts.other) button.appendChild(statusTag("unk", "기타 " + counts.other, "sm"));
    }
    button.setAttribute("aria-label", total
        ? "안 읽은 알림 " + total + "개 · 알림 목록으로 이동" : "알림 목록으로 이동");
}

function nodeLabel(name) {
    const match = String(name).match(/pc[-_ ]?0*(\d+)$/i);
    return match ? "PC" + Number(match[1]) : name;
}

function primaryProcess(node) {
    const processes = ((node || {}).training || {}).processes || [];
    if (!processes.length) return {};

    const marked = processes.find(p => p && p.primary === true);
    if (marked) return marked;

    // Rolling upgrades may briefly expose an older worker payload without the
    // primary marker.  A lower elapsed time is the runner started most
    // recently, independent of checkpoint numbering or project name.
    return processes.reduce((best, candidate) => {
        const bestElapsed = Number(best && best.elapsed_sec);
        const candidateElapsed = Number(candidate && candidate.elapsed_sec);
        const b = Number.isFinite(bestElapsed) ? bestElapsed : Infinity;
        const c = Number.isFinite(candidateElapsed) ? candidateElapsed : Infinity;
        return c < b ? candidate : best;
    }, processes[0] || {});
}

function trainingProcesses(node) {
    const processes = [...((((node || {}).training || {}).processes) || [])];
    const primary = primaryProcess(node);
    return processes.sort((a, b) => {
        if (a === primary) return -1;
        if (b === primary) return 1;
        const ae = Number(a && a.elapsed_sec);
        const be = Number(b && b.elapsed_sec);
        return (Number.isFinite(ae) ? ae : Infinity)
             - (Number.isFinite(be) ? be : Infinity);
    });
}

// Shared by the overview card and the detail process list so both always say
// the same thing about progress and completion time.
function progressEstimate(process) {
    const p = process || {};
    const tb = p.tensorboard_metrics || {};
    const progress = p.training_progress || {};
    // Transport/CDN age is not evidence that the training itself stalled.
    const sampleAge = Number.isFinite(progress.sampled_at)
        ? Math.max(0, Date.now() / 1000 - progress.sampled_at) : null;
    const publicationDelayed = sampleAge !== null && sampleAge > 180;
    const stale = tb.stale || p.ended_observed_at || sampleAge === null;
    let eta = "계산 중 · 속도 수집 중", finish = "-";
    if (stale || progress.status === 'unavailable') eta = "예측 불가 · 상태 갱신 필요";
    else if (progress.status === 'target_unknown') eta = "예측 불가 · 최대값 미확인";
    else if (progress.status === 'target_reached') eta = "목표 iteration 도달 · 종료 처리 중";
    else if (progress.status === 'estimated' && Number.isFinite(progress.remaining_seconds)) {
        const minutes = Math.max(1, Math.ceil(progress.remaining_seconds / 60));
        eta = "약 " + (minutes >= 60 ? Math.floor(minutes / 60) + "시간 " : "") + (minutes % 60) + "분";
        finish = new Date(progress.estimated_finish_at * 1000).toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
        }) + " KST";
        if (publicationDelayed) {
            // Keep the last measured estimate, not a fabricated countdown.
            eta += " · 마지막 수집 기준";
            finish += " · 갱신 지연";
        }
    }
    return {
        maximum: progress.max_iterations,
        percent: progress.progress_percent,
        sampleAge: sampleAge,
        publicationDelayed: publicationDelayed,
        eta: eta,
        finish: finish,
    };
}

function stepValue(process) {
    const step = ((process || {}).tensorboard_metrics || {}).current_logged_step;
    if (isNum(step)) return step.toLocaleString();
    return step !== undefined && step !== null ? String(step) : missing();
}

function processItem(process, isPrimary) {
    const p = process || {};
    const exp = p.experiment || {};
    const tb = p.tensorboard_metrics || {};
    const ck = p.latest_checkpoint || {};
    const est = progressEstimate(p);
    const item = el("article", "process-item" + (isPrimary ? " primary" : ""));

    const head = el("div", "process-head");
    const name = el("div", "process-name", p.project || p.script || "Training process");
    name.title = p.command || p.project || "";
    head.appendChild(name);
    head.appendChild(el(
        "span", "role" + (isPrimary ? " primary" : ""),
        isPrimary ? "대시보드 추적" : "추가 실행"));
    item.appendChild(head);

    const rows = el("div", "process-rows");
    const experiment = row("Experiment", exp.name || missing("탐지 중"), exp.name ? "mono" : "");
    experiment.classList.add("span");
    rows.appendChild(experiment);
    if (Number.isFinite(est.percent)) {
        const progressRow = row("학습 진행률", est.percent.toFixed(1) + " %");
        progressRow.classList.add("span");
        progressRow.style.borderBottom = "none";
        rows.appendChild(progressRow);
        const bar = progressBar(est.percent, "학습 진행률");
        bar.classList.add("span");
        rows.appendChild(bar);
    }
    rows.appendChild(row("PID", p.pid !== undefined && p.pid !== null ? String(p.pid) : missing()));
    rows.appendChild(row("Runtime", p.elapsed_human || missing()));
    rows.appendChild(row("Step", stepValue(p)));
    rows.appendChild(row("Checkpoint", ck.name || ck.checkpoint_name || missing(),
                         ck.name || ck.checkpoint_name ? "mono" : ""));
    rows.appendChild(row("최대 iteration", Number.isFinite(est.maximum)
        ? est.maximum.toLocaleString() : missing("확인 불가")));
    rows.appendChild(row("학습 완료까지", est.eta));
    rows.appendChild(row("예상 완료 시각", est.finish === "-" ? missing("-") : est.finish));
    const sources = tb.sources || {};
    const sourceNames = [];
    if (sources.tensorboard) sourceNames.push("TensorBoard");
    if (sources.training_log) sourceNames.push("Training log");
    rows.appendChild(row("Metrics Source", sourceNames.join(" + ") || missing()));
    if (est.publicationDelayed) {
        const delayed = row("예측 데이터", statusTag("warn",
            Math.floor(est.sampleAge / 60) + "분 전 수집 · 현재 학습 상태 미확인", "sm"));
        delayed.classList.add("span");
        rows.appendChild(delayed);
    }
    item.appendChild(rows);
    return item;
}

function selectCoreMetrics(metrics, definitions) {
    const source = metrics || {};
    const selected = [];
    for (const definition of definitions) {
        const name = definition.aliases.find(alias =>
            Object.prototype.hasOwnProperty.call(source, alias));
        if (name) selected.push(Object.assign({name: name}, definition));
    }
    // An unfamiliar trainer can use entirely new metric names. Keep its
    // telemetry visible without guessing units or relabeling it as a reward.
    if (!selected.length) {
        Object.keys(source).sort().slice(0, 6).forEach(name => {
            selected.push({name: name, label: name, group: "자동 감지 지표"});
        });
    }
    return selected;
}

function coreMetricValue(metric, value) {
    if (typeof value !== "number") return fmt(value);
    if (metric.format === "percent") return (value * 100).toFixed(1) + " %";
    if (metric.format === "status") return value >= 0.5 ? "통과" : "실패";
    return fmt(value);
}

function allMetricNames(metrics, nodeName) {
    return Object.keys(metrics || {})
        .filter(name => !(nodeLabel(nodeName) === "PC2" && name.endsWith("/mean")))
        .sort();
}

function trainingMetricsCard(metrics, metricEntries, catalog, coreOnly) {
    const card = el("div", "card");
    const inner = el("div", "metric-groups");
    const metricGroups = {};

    for (const metric of metricEntries) {
        const k = metric.name;
        const meta = catalog[k] || {};
        const group = coreOnly
            ? metric.group
            : (meta.group || ("reward" === k.slice(0, 6) ? "reward" : "training"));
        if (!metricGroups[group]) {
            const section = el("section", "metric-group");
            section.appendChild(el("h3", "", group));
            inner.appendChild(section);
            metricGroups[group] = section;
        }

        // Reward terms are signed by design, so the sign is shown as a number,
        // not as a green/red status. Only pass/fail checks carry a status.
        const v = metrics[k] && metrics[k].value;
        const label = coreOnly ? metric.label : (meta.label || k);
        let value;
        if (v === null || v === undefined) {
            value = missing();
        } else if (metric.format === "status" && typeof v === "number") {
            value = statusTag(v >= 0.5 ? "ok" : "err", v >= 0.5 ? "통과" : "실패");
        } else {
            value = coreOnly
                ? coreMetricValue(metric, v)
                : fmt(v) + (meta.unit ? " " + meta.unit : "");
        }
        const r = row(label, value);
        r.firstChild.title = label === k ? k : label + " · " + k;
        metricGroups[group].appendChild(r);
    }

    card.appendChild(inner);
    return card;
}

function heartbeat(data, name) {
    const health = (((data.health || {}).nodes || {})[name]) || {};
    const reported = health.heartbeat_age_sec;
    if (!isNum(reported)) return null;
    const generatedAt = Number(data.generated_at);
    if (!Number.isFinite(generatedAt)) return { age: reported, at: null };
    return {
        age: reported + Math.max(0, Date.now() / 1000 - generatedAt),
        at: (generatedAt - reported) * 1000,
    };
}

function heartbeatText(data, name, withClock) {
    const hb = heartbeat(data, name);
    if (!hb) return null;
    return ageText(hb.age) + (withClock && hb.at !== null ? " (" + clockText(hb.at) + ")" : "");
}

    box.appendChild(dd);

    list.appendChild(box);

    const n = (data.status || {})[name] || {};

    const primary = primaryProcess(n);
    const card = el("section", "pc-card " + state.level + (state.stale ? " is-stale" : ""));
    card.setAttribute("aria-label", nodeLabel(name) + " 상태");

    const top = el("div", "pc-top");
    const ident = el("div");
    ident.appendChild(el("h2", "pc-name", nodeLabel(name)));

    top.appendChild(ident);
    const side = el("div", "pc-state");
    side.appendChild(statusTag(state.level, state.text, "lg", state.icon));

    card.appendChild(top);

    if (state.stale) {
        card.appendChild(notice(state.level,
            "아래 값은 마지막으로 받은 값입니다. 현재 상태는 확인되지 않았습니다."));
    }
    if (processes.length > 1) {
        card.appendChild(notice("warn",
            "동일 PC에서 학습 " + processes.length + "개가 동시에 실행 중입니다. " +
            "상세 화면에서 각 PID와 실험명을 확인하세요."));
    }

    if (!processes.length) {
        card.appendChild(el("div", "pc-empty", "실행 중인 학습 프로세스가 없습니다."));
    } else {
        const exp = (primary.experiment || {}).name;
        const expBox = el("div", "pc-exp");
        expBox.appendChild(el("span", "k", processes.length > 1 ? "실험 · 대시보드 추적" : "실험"));

        expName.title = exp || "";
        expBox.appendChild(expName);
        card.appendChild(expBox);

        const est = progressEstimate(primary);
        const progress = el("div", "pc-progress");
        const line = el("div", "line");
        if (Number.isFinite(est.percent)) {
            line.appendChild(el("span", "pct", est.percent.toFixed(1) + " %"));
            progress.appendChild(line);
            progress.appendChild(progressBar(est.percent, nodeLabel(name) + " 학습 진행률"));
        } else {
            // No bar at all: an empty track would read as 0 %.
            line.appendChild(el("span", "pct na", "진행률 없음"));
            progress.appendChild(line);
        }
        card.appendChild(progress);

        const facts = el("dl", "facts");
        const fact = (label, value) => {
            facts.appendChild(el("dt", "", label));
            const dd = el("dd");
            if (value instanceof Node) dd.appendChild(value);
            else dd.textContent = value;
            facts.appendChild(dd);
        };
        fact("학습 완료까지", est.eta);
        fact("예상 완료 시각", est.finish === "-" ? missing("-") : est.finish);
        fact("Step", stepValue(primary));
        fact("최대 iteration", Number.isFinite(est.maximum)
            ? est.maximum.toLocaleString() : missing("확인 불가"));
        card.appendChild(facts);
        if (est.publicationDelayed) {
            card.appendChild(statusTag("warn", "예측 데이터 " + Math.floor(est.sampleAge / 60) +
                "분 전 수집 · 현재 학습 상태 미확인", "sm"));
        }

        const others = processes.filter(process => process !== primary);
        if (others.length) {
            const box = el("div", "pc-others");
            box.appendChild(el("span", "k", "추가 실행"));
            for (const other of others) {
                const otherEst = progressEstimate(other);
                const otherLine = el("div", "pc-other");
                const otherName = ((other || {}).experiment || {}).name;
                const label = el("span", "mono" + (otherName ? "" : " na"), otherName || "탐지 중");
                label.title = otherName || "";
                otherLine.appendChild(label);
                if (Number.isFinite(otherEst.percent)) {
                    otherLine.appendChild(el("b", "", otherEst.percent.toFixed(1) + " %"));
                } else {
                    otherLine.appendChild(missing("진행률 없음"));
                }
                box.appendChild(otherLine);

        }

    card.appendChild(systemList(n));

    open.dataset.focusKey = "node:" + name;

    card.appendChild(open);
    return card;
}

const expandedSections = {
    metrics: sessionStorage.getItem("rl_section_metrics_detail") === "expanded",
    history: sessionStorage.getItem("rl_section_history_detail") === "expanded"
};

function collapsibleSection(host, key, title, summaryBadgeText, fullBadgeText, subtitle) {
    const head = el("div", "section-h");
    head.appendChild(el("h2", "", title));
    if (subtitle) {
        const sub = el("span", "sub mono", subtitle);
        sub.title = subtitle;
        head.appendChild(sub);
    }

    const actions = el("div", "tools");
    const badge = el("span", "badge");
    actions.appendChild(badge);

    const always = el("div");
    const summary = el("div");
    summary.id = key + "-summary";
    const full = el("div");
    full.id = key + "-full";

    const toggle = el("button", "btn section-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-controls", full.id);
    let fullRenderer = null;
    let fullRendered = false;

    function sync() {
        const expanded = expandedSections[key];
        if (expanded && fullRenderer && !fullRendered) {
            fullRenderer(full);
            fullRendered = true;
        }
        summary.hidden = expanded;
        full.hidden = !expanded;
        badge.textContent = expanded ? fullBadgeText : summaryBadgeText;
        toggle.textContent = expanded ? "핵심만 보기" : "전체 펼치기";
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.setAttribute("aria-label", title + (expanded ? " 핵심만 보기" : " 전체 펼치기"));
    }

    toggle.onclick = () => {
        expandedSections[key] = !expandedSections[key];
        sessionStorage.setItem(
            "rl_section_" + key + "_detail",
            expandedSections[key] ? "expanded" : "collapsed");
        sync();
    };

    actions.appendChild(toggle);
    head.appendChild(actions);
    host.appendChild(head);
    host.appendChild(always);
    host.appendChild(summary);
    host.appendChild(full);
    sync();
    return {
        always: always,
        summary: summary,
        full: full,
        setFullRenderer: renderer => {
            fullRenderer = renderer;
            sync();
        }
    };
}

const SVGNS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
}

// One metric, drawn small. Deliberately dependency-free: a chart library would
// mean a CDN request from whatever network the viewer is on, and these are
// simple line plots. One series per chart, so the line uses a single neutral
// data color; status colors stay reserved for status.
const CHART_W = 300, CHART_H = 76, CHART_PAD = 6;
const openChartTables = new Set();

function metricChart(metric, steps, values) {
    const label = metric.label || metric.name;
    const show = v => coreMetricValue(metric, v);
    const samples = values.map((value, i) => {
        const step = steps[i];
        return { step: step === null || step === undefined || step === "" ? NaN : Number(step),
                 value: value };
    });
    const usable = s => Number.isFinite(s.value) && Number.isFinite(s.step);
    const valid = samples.filter(usable);
    if (!valid.length) return null;

    let lo = Infinity, hi = -Infinity, x0 = Infinity, x1 = -Infinity;
    for (const s of valid) {
        lo = Math.min(lo, s.value);
        hi = Math.max(hi, s.value);
        x0 = Math.min(x0, s.step);
        x1 = Math.max(x1, s.step);
    }
    const minValue = lo, maxValue = hi;
    if (hi === lo) { hi = lo + 1; lo = lo - 1; }
    const span = x1 - x0;
    const px = span === 0
        ? () => CHART_W / 2
        : s => CHART_PAD + (s - x0) / span * (CHART_W - 2 * CHART_PAD);
    const py = v => CHART_H - CHART_PAD - (v - lo) / (hi - lo) * (CHART_H - 2 * CHART_PAD);
    const last = valid[valid.length - 1];

    const box = el("figure", "chart");
    const head = el("figcaption", "chart-head");
    const title = el("span", "chart-label", label);
    title.title = label === metric.name ? metric.name : label + " · " + metric.name;
    head.appendChild(title);
    head.appendChild(el("span", "chart-last", show(last.value)));
    box.appendChild(head);

    const svg = svgEl("svg", { viewBox: "0 0 " + CHART_W + " " + CHART_H,
                               class: "chart-svg", "aria-hidden": "true", focusable: "false" });

    // Zero line, but only when the data actually straddles it — otherwise it
    // sits on an edge and just adds noise.
    if (lo < 0 && hi > 0) {
        svg.appendChild(svgEl("line", {
            x1: CHART_PAD, x2: CHART_W - CHART_PAD, y1: py(0), y2: py(0), class: "chart-zero" }));
    }

    // Gaps: a metric that appeared late has leading nulls, and breaking the
    // path there is more honest than interpolating across them.
    let d = "", pen = false;
    for (const s of samples) {
        if (!usable(s)) { pen = false; continue; }
        d += (pen ? "L" : "M") + px(s.step).toFixed(1) + " " + py(s.value).toFixed(1) + " ";
        pen = true;
    }
    svg.appendChild(svgEl("path", { d: d, class: "chart-line" }));

    // A resumed or already-completed run may be observed only once, and a
    // sample between two gaps has no segment to sit on. Show such real samples
    // as points instead of claiming there is no history.
    samples.forEach((s, i) => {
        if (!usable(s)) return;
        const joined = (i > 0 && usable(samples[i - 1])) ||
                       (i < samples.length - 1 && usable(samples[i + 1]));
        if (!joined) {
            svg.appendChild(svgEl("circle", {
                cx: px(s.step), cy: py(s.value), r: 3, class: "chart-dot" }));
        }
    });
    svg.appendChild(svgEl("circle", {
        cx: px(last.step), cy: py(last.value), r: 4, class: "chart-end" }));

    const cross = svgEl("g", { class: "chart-cross", visibility: "hidden" });
    const crossLine = svgEl("line", { y1: 0, y2: CHART_H });
    const crossDot = svgEl("circle", { r: 4 });
    cross.appendChild(crossLine);
    cross.appendChild(crossDot);
    svg.appendChild(cross);

    const plot = el("div", "chart-plot");
    plot.tabIndex = 0;
    plot.setAttribute("role", "img");
    plot.setAttribute("aria-label", label + " 추이 · step " + x0.toLocaleString() + "–" +
        x1.toLocaleString() + " · " + valid.length + "개 값 · 최소 " + show(minValue) +
        " · 최대 " + show(maxValue) + " · 마지막 " + show(last.value) +
        " · 좌우 방향키로 값 확인");
    plot.appendChild(svg);
    const area = el("div", "chart-area");
    area.appendChild(plot);
    box.appendChild(area);

    const axis = el("div", "chart-axis");
    axis.appendChild(el("span", "", "step " + x0.toLocaleString()));
    axis.appendChild(el("span", "", valid.length === 1 ? "수집 1점" : x1.toLocaleString()));
    box.appendChild(axis);

    const foot = el("div", "chart-foot");
    foot.appendChild(el("span", "", minValue === maxValue
        ? (valid.length === 1 ? "값 " : "모든 값 ") + show(minValue)
        : "최소 " + show(minValue) + " · 최대 " + show(maxValue)));
    box.appendChild(foot);

    // The readout floats over the plot so showing or clearing it never moves
    // the layout (a shift between mousedown and mouseup swallows clicks). It is
    // a sibling of the role="img" plot so assistive tech still hears it.
    const readout = el("span", "chart-readout");
    readout.setAttribute("aria-live", "polite");
    area.appendChild(readout);

    // Crosshair: snaps to the nearest real sample; same readout on keyboard.
    let cursor = -1;
    function showAt(index) {
        if (index < 0) {
            cross.setAttribute("visibility", "hidden");
            readout.textContent = "";
            return;
        }
        const s = valid[index];
        crossLine.setAttribute("x1", px(s.step));
        crossLine.setAttribute("x2", px(s.step));
        crossDot.setAttribute("cx", px(s.step));
        crossDot.setAttribute("cy", py(s.value));
        cross.setAttribute("visibility", "visible");
        readout.textContent = "step " + s.step.toLocaleString() + " · " + show(s.value);
        // Sit on the side away from the crosshair.
        const onLeft = px(s.step) > CHART_W / 2;
        readout.style.left = onLeft ? "0" : "auto";
        readout.style.right = onLeft ? "auto" : "0";
    }
    plot.addEventListener("pointermove", event => {
        const rect = svg.getBoundingClientRect();
        if (!rect.width) return;
        const x = (event.clientX - rect.left) / rect.width * CHART_W;
        let best = 0, bestDistance = Infinity;
        valid.forEach((s, i) => {
            const distance = Math.abs(px(s.step) - x);
            if (distance < bestDistance) { bestDistance = distance; best = i; }
        });
        cursor = best;
        showAt(best);
    });
    plot.addEventListener("pointerleave", () => {
        if (document.activeElement !== plot) showAt(-1);
    });
    plot.addEventListener("focus", () => {
        if (cursor < 0) cursor = valid.length - 1;
        showAt(cursor);
    });
    plot.addEventListener("blur", () => showAt(-1));
    plot.addEventListener("keydown", event => {
        if (event.key === "ArrowLeft") cursor = Math.max(0, cursor - 1);
        else if (event.key === "ArrowRight") cursor = Math.min(valid.length - 1, cursor + 1);
        else if (event.key === "Home") cursor = 0;
        else if (event.key === "End") cursor = valid.length - 1;
        else return;
        event.preventDefault();
        showAt(cursor);
    });

    // The hover readout never gates a value: every sample is also in a table.
    const table = el("details", "chart-data");
    table.appendChild(el("summary", "", "값 표 보기 · " + valid.length + "개"));
    const buildTable = () => {
        if (table.dataset.built) return;
        table.dataset.built = "1";
        const wrap = el("div", "chart-table-wrap");
        const grid = el("table", "chart-table");
        const headRow = el("tr");
        headRow.appendChild(el("th", "", "step"));
        headRow.appendChild(el("th", "", "값"));
        const thead = el("thead");
        thead.appendChild(headRow);
        grid.appendChild(thead);
        const tbody = el("tbody");
        for (let i = valid.length - 1; i >= 0; i--) {
            const tr = el("tr");
            tr.appendChild(el("td", "", valid[i].step.toLocaleString()));
            tr.appendChild(el("td", "", show(valid[i].value)));
            tbody.appendChild(tr);
        }
        grid.appendChild(tbody);
        wrap.appendChild(grid);
        table.appendChild(wrap);
    };
    table.addEventListener("toggle", () => {
        if (table.open) {
            openChartTables.add(metric.name);
            buildTable();
        } else {
            openChartTables.delete(metric.name);
        }
    });
    if (openChartTables.has(metric.name)) {
        buildTable();
        table.open = true;
    }
    box.appendChild(table);
    return box;
}

function historyChartsCard(h, steps, metricEntries) {
    const grid = el("div", "chart-grid");

    for (const metric of metricEntries) {
        const name = metric.name;
        const points = (h.points || {})[name];
        const plotSteps = points ? points.map(p => p.step) : steps;
        const values = (points ? points.map(p => p.value) : (h.series || {})[name]) || [];
        if (!values.some(v => Number.isFinite(v))) continue;
        const chart = metricChart(metric, plotSteps, values);
        if (chart) grid.appendChild(chart);
    }

    if (!grid.children.length) {
        return el("div", "card empty-card", "표시할 값이 있는 트레이닝 추이가 없습니다.");
    }
    return grid;
}

function renderHistory(data, nodeName) {
    const host = document.getElementById("charts");
    host.textContent = "";
    const selected = selectedRuns[nodeName];
    const currentHistory = (data.history || {})[nodeName] || {};
    const h = selected && selected !== currentHistory.experiment
        ? ((((data.history || {})._archives || {})[nodeName] || {})[selected] || {})
        : currentHistory;
    const points = h.points || {};
    const steps = [...new Set(Object.values(points).flatMap(values =>
        (values || []).map(point => point.step)))].sort((a, b) => a - b);
    const coreMetrics = selectCoreMetrics(points, CORE_HISTORY_METRICS);
    const fullMetrics = allMetricNames(points, nodeName).map(name => ({name: name}));

    const stepText = s => isNum(s) ? s.toLocaleString() : String(s);
    const rangeLabel = steps.length
        ? (steps.length === 1
            ? "수집 1점 · step " + stepText(steps[0])
            : "step " + stepText(steps[0]) + " → " + stepText(steps[steps.length - 1]))
        : "수집 기록 없음";
    const section = collapsibleSection(
        host, "history", "Training History",
        rangeLabel + " · " + coreMetrics.length + " 핵심",
        rangeLabel + " · " + fullMetrics.length + " 전체",
        h.experiment || selected || currentHistory.experiment);

    if (!steps.length || !coreMetrics.length) {
        section.summary.appendChild(el("div", "card empty-card", "표시할 핵심 트레이닝 추이가 없습니다."));
    } else {
        section.summary.appendChild(historyChartsCard(h, steps, coreMetrics));
