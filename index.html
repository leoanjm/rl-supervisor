<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RL Experiment Supervisor</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body {
    margin: 0; padding: 24px;
    background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
}
h1 { font-size: 20px; margin: 0 0 4px; }
.sub { color: #8b949e; font-size: 12px; margin-bottom: 20px; }
.grid { display: grid; gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { background: #161b22; border: 1px solid #30363d;
        border-radius: 10px; padding: 18px; }
.card-title { color: #8b949e; font-size: 12px; font-weight: 700;
              letter-spacing: 1px; margin-bottom: 14px; }
.metric { display: flex; justify-content: space-between; gap: 12px;
          padding: 7px 0; border-bottom: 1px solid #21262d;
          align-items: baseline; }
.metric:last-child { border-bottom: none; }
.label { color: #8b949e; overflow: hidden; text-overflow: ellipsis;
         white-space: nowrap; min-width: 0; }
.value { font-weight: 600; text-align: right; white-space: nowrap; }
.green { color: #3fb950; } .red { color: #f85149; } .blue { color: #58a6ff; }
.node-head { display: flex; align-items: center; gap: 12px;
             justify-content: space-between; margin: 26px 0 14px;
             flex-wrap: wrap; }
.node-identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
.node-name { font-size: 18px; font-weight: 700; }
.node-source { color: #8b949e; font-size: 11px; }
.node-link { width: auto; margin: 0; padding: 0; border: 0; border-radius: 0;
             background: transparent; color: inherit; display: flex;
             align-items: baseline; gap: 9px; text-align: left; }
.node-link:hover .node-name { color: #58a6ff; }
.node-link:focus-visible { outline: 2px solid #58a6ff; outline-offset: 5px; }
.node-open { color: #58a6ff; font-size: 11px; }
.node-summaries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                  gap: 20px; align-items: start; }
.node-summary { min-width: 0; }
.node-summary .node-head { margin: 20px 0 12px; }
.node-summary .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.node-summary .card { min-width: 0; padding: 14px; }
.node-summary .metric { gap: 8px; padding: 6px 0; }
.node-summary .value { overflow: hidden; text-overflow: ellipsis; }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 11px;
         font-weight: 700; border: 1px solid #30363d; }
.on { color: #3fb950; border-color: #3fb950; }
.off { color: #f85149; border-color: #f85149; }
.warn { color: #d29922; border-color: #d29922; }
.wide { grid-column: 1 / -1; }
.training-card.concurrent { border-color: #d29922; }
.card-title-line { display: flex; align-items: center; justify-content: space-between;
                   gap: 10px; margin-bottom: 12px; }
.card-title-line .card-title { margin: 0; }
.run-count { color: #8b949e; font-size: 10px; white-space: nowrap; }
.concurrent-notice { color: #d29922; background: rgba(210, 153, 34, 0.08);
                     border: 1px solid rgba(210, 153, 34, 0.45);
                     border-radius: 7px; padding: 8px 10px; margin-bottom: 10px;
                     font-size: 11px; line-height: 1.45; }
.process-list { display: flex; flex-direction: column; gap: 10px; }
.process-item { min-width: 0; padding: 11px; border: 1px solid #30363d;
                border-radius: 8px; background: #0d1117; }
.process-item.primary { border-color: #238636; background: #0d1610; }
.process-head { display: flex; align-items: center; justify-content: space-between;
                gap: 8px; margin-bottom: 5px; }
.process-name { min-width: 0; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; color: #c9d1d9; font-size: 11px;
                font-weight: 700; }
.process-role { flex: 0 0 auto; padding: 2px 6px; border: 1px solid #30363d;
                border-radius: 10px; color: #8b949e; font-size: 9px;
                font-weight: 700; }
.process-role.primary { color: #3fb950; border-color: #238636; }
.process-item .metric { padding: 5px 0; font-size: 11px; }
.process-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 12px; }
.process-section .node-head { margin-top: 18px; }
.detail-toolbar { display: flex; justify-content: space-between; align-items: center;
                  gap: 12px; margin: 22px 0 8px; flex-wrap: wrap; }
.detail-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.nav-btn { width: auto; margin: 0; padding: 7px 11px; border: 1px solid #30363d;
           background: #21262d; color: #c9d1d9; font-size: 12px; }
.nav-btn:hover { background: #30363d; }
.nav-btn.active { color: #58a6ff; border-color: #58a6ff; background: #111923; }
.detail-title { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; }
.section-head-actions { display: flex; align-items: center; gap: 8px; }
.section-toggle { width: auto; margin: 0; padding: 6px 10px;
                  border: 1px solid #30363d; background: #21262d;
                  color: #c9d1d9; font-size: 11px; }
.section-toggle:hover { background: #30363d; }
.section-toggle:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
.empty-card { color: #8b949e; text-align: center; padding: 28px 18px; }
#gate { max-width: 380px; margin: 12vh auto; }
input { width: 100%; padding: 10px; border-radius: 8px;
        border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
        font-family: inherit; font-size: 14px; }
button { width: 100%; margin-top: 10px; padding: 10px; border: none;
         border-radius: 8px; background: #1f6feb; color: #fff;
         font-family: inherit; font-size: 14px; font-weight: 600;
         cursor: pointer; }
#err { color: #f85149; margin-top: 12px; min-height: 18px; }
.alert-card { padding: 0; overflow: hidden; margin-bottom: 20px; }
.alert-header { display: flex; align-items: center; justify-content: space-between;
                gap: 14px; padding: 16px 18px; border-bottom: 1px solid #30363d;
                flex-wrap: wrap; }
.alert-heading { display: flex; align-items: center; gap: 10px; }
.alert-heading .card-title { margin: 0; }
.alert-count { color: #8b949e; font-size: 11px; }
.alert-tools { display: flex; gap: 8px; flex-wrap: wrap; }
.alert-btn { width: auto; margin: 0; padding: 6px 10px; border-radius: 6px;
             border: 1px solid #30363d; background: #21262d; color: #c9d1d9;
             font-size: 11px; font-weight: 600; }
.alert-btn:hover { background: #30363d; }
.alert-btn.danger { color: #ff7b72; }
.alert-list { display: flex; flex-direction: column; }
.alert-item { display: grid; grid-template-columns: minmax(0, 1fr) auto;
              gap: 12px; padding: 14px 18px; border-bottom: 1px solid #21262d;
              border-left: 3px solid transparent; }
.alert-item:last-child { border-bottom: none; }
.alert-item.unread { border-left-color: #58a6ff; background: #111923; }
.alert-item.read { opacity: 0.68; }
.alert-main { min-width: 0; }
.alert-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
              color: #8b949e; font-size: 11px; flex-wrap: wrap; }
.alert-level { border: 1px solid #30363d; border-radius: 10px; padding: 2px 7px;
               font-weight: 700; text-transform: uppercase; }
.alert-level.critical { color: #f85149; border-color: #f85149; }
.alert-level.warning { color: #d29922; border-color: #d29922; }
.alert-message { line-height: 1.5; overflow-wrap: anywhere; }
.alert-actions { display: flex; align-items: center; gap: 6px; }
.alert-empty { color: #8b949e; padding: 18px; text-align: center; }
.video-btn { width: 100%; margin-top: 14px; padding: 8px 10px;
             background: #21262d; border: 1px solid #58a6ff;
             color: #58a6ff; font-size: 12px; }
.video-btn:hover { background: #111923; }
.video-unavailable { color: #6e7681; font-size: 11px; margin-top: 14px;
                     text-align: center; }
.video-modal { position: fixed; inset: 0; z-index: 1000; padding: 24px;
               display: grid; place-items: center;
               background: rgba(1, 4, 9, 0.86); }
.video-modal[hidden] { display: none; }
.video-dialog { width: min(960px, 100%); max-height: calc(100vh - 48px);
                overflow: hidden; padding: 18px; background: #161b22;
                border: 1px solid #30363d; border-radius: 12px;
                box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55); }
.video-head { display: flex; align-items: flex-start; justify-content: space-between;
              gap: 16px; margin-bottom: 12px; }
.video-title { font-size: 15px; font-weight: 700; }
.video-meta { color: #8b949e; font-size: 11px; margin-top: 5px;
              line-height: 1.5; }
.video-close { width: auto; margin: 0; padding: 6px 10px;
               background: #21262d; border: 1px solid #30363d;
               color: #c9d1d9; font-size: 12px; }
.video-stage { position: relative; width: 100%; aspect-ratio: 16 / 9;
               overflow: hidden; background: #010409; border-radius: 8px; }
.video-player { position: absolute; inset: 0; display: block; width: 100%;
                height: 100%; object-fit: contain; background: #010409; }
.video-status { position: absolute; inset: 0; z-index: 2; display: grid;
                place-items: center; padding: 24px; color: #8b949e;
                text-align: center; background: #010409; }
.video-player[hidden], .video-status[hidden] { display: none; }
@media (max-width: 640px) {
    body { padding: 14px; }
    .alert-item { grid-template-columns: 1fr; }
    .alert-actions { justify-content: flex-end; }
    .alert-tools { width: 100%; }
    .node-link { align-items: flex-start; flex-direction: column; gap: 2px; }
    .node-open { display: none; }
    .detail-nav { width: 100%; }
    .node-summaries, .node-summary .grid { grid-template-columns: 1fr; }
}
@media (min-width: 641px) and (max-width: 900px) {
    .node-summaries { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="gate">
  <h1>RL Experiment Supervisor</h1>
  <div class="sub">데이터는 암호화되어 있습니다. 암호를 입력하세요.</div>
  <input id="pass" type="password" placeholder="암호" autocomplete="current-password">
  <button id="go">열기</button>
  <div id="err"></div>
</div>

<div id="app" style="display:none">
  <h1>RL Experiment Supervisor</h1>
  <div class="sub" id="stamp">-</div>
  <main id="overview">
    <div id="alertbox"></div>
    <div id="nodes"></div>
  </main>
  <main id="detail" style="display:none">
    <div id="detailhead"></div>
    <div id="jobs"></div>
    <div id="metrics"></div>
    <div id="charts"></div>
    <div id="rank"></div>
  </main>
</div>

<div id="videoModal" class="video-modal" hidden role="dialog" aria-modal="true"
     aria-labelledby="videoTitle">
  <div class="video-dialog">
    <div class="video-head">
      <div>
        <div id="videoTitle" class="video-title">정책 테스트 영상</div>
        <div id="videoMeta" class="video-meta"></div>
      </div>
      <button id="videoClose" class="video-close" type="button" aria-label="영상 닫기">닫기</button>
    </div>
    <div class="video-stage">
      <div id="videoStatus" class="video-status">영상을 준비하고 있습니다.</div>
      <video id="videoPlayer" class="video-player" controls playsinline
             preload="metadata" hidden></video>
    </div>
  </div>
</div>

<script>
// The payload is AES-256-GCM under a PBKDF2-HMAC-SHA256 key, produced by
// rl_publish.py on the Jetson. Parameters travel with the blob so they can be
// changed there without editing this page.
// 600k PBKDF2 iterations is deliberately slow — that is the point on the
// attacker's side. Re-deriving on every auto-refresh would just burn the
// viewer's CPU for nothing, so cache per (salt, iterations). The salt only
// changes when the Jetson re-encrypts with fresh randomness.
let keyCache = { id: null, key: null };
let latestEnvelope = null;

function decodeBase64(s) {
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}

async function decryptionKey(blob, passphrase) {
    const id = blob.salt + ":" + blob.iterations + ":" + passphrase;
    let key = keyCache.id === id ? keyCache.key : null;

    if (!key) {
        const base = await crypto.subtle.importKey(
            "raw", new TextEncoder().encode(passphrase),
            "PBKDF2", false, ["deriveKey"]);

        key = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: decodeBase64(blob.salt),
              iterations: blob.iterations, hash: "SHA-256" },
            base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

        keyCache = { id: id, key: key };
    }
    return key;
}

async function decrypt(blob, passphrase) {
    const key = await decryptionKey(blob, passphrase);

    // Python's AESGCM appends the 16-byte tag, which is what AES-GCM decrypt
    // expects by default here.
    const plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decodeBase64(blob.iv) },
        key, decodeBase64(blob.data));

    return JSON.parse(new TextDecoder().decode(plain));
}

function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
}

let videoObjectUrl = null;
let videoGeneration = 0;
let videoAbort = null;

function closeRankVideo() {
    videoGeneration++;
    if (videoAbort) videoAbort.abort();
    videoAbort = null;
    const modal = document.getElementById("videoModal");
    const player = document.getElementById("videoPlayer");
    player.pause();
    player.removeAttribute("src");
    player.load();
    player.hidden = true;
    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
    videoObjectUrl = null;
    modal.hidden = true;
}

async function openRankVideo(meta, nodeName, rankTitle) {
    closeRankVideo();
    const generation = ++videoGeneration;
    videoAbort = new AbortController();
    const signal = videoAbort.signal;
    const envelope = latestEnvelope;
    const current = () => generation === videoGeneration && !signal.aborted;
    const modal = document.getElementById("videoModal");
    const status = document.getElementById("videoStatus");
    const player = document.getElementById("videoPlayer");
    document.getElementById("videoTitle").textContent =
        nodeLabel(nodeName) + " · " + rankTitle;
    document.getElementById("videoMeta").textContent =
        (meta.checkpoint || "-") + " · " + (meta.scenarios || []).join(" → ");
    player.pause();
    player.removeAttribute("src");
    player.load();
    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
    videoObjectUrl = null;
    status.textContent = "암호화된 영상을 불러와 복호화하는 중입니다…";
    status.hidden = false;
    player.hidden = true;
    modal.hidden = false;

    try {
        if (!envelope) throw new Error("암호화 정보가 없습니다.");
        if (meta.node_name !== nodeName) throw new Error("영상 노드 정보가 일치하지 않습니다.");
        const response = await fetch(
            meta.path + "?v=" + encodeURIComponent(meta.updated_at || ""),
            { cache: "no-store", signal });
        if (!current()) return;
        if (!response.ok) {
            throw new Error("영상 파일을 불러오지 못했습니다 (" + response.status + ")");
        }
        const key = await decryptionKey(envelope, passphrase);
        if (!current()) return;
        const plaintext = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: decodeBase64(meta.iv) },
            key, await response.arrayBuffer());
        if (!current() || modal.hidden) return;
        if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);
        videoObjectUrl = URL.createObjectURL(
            new Blob([plaintext], { type: meta.mime || "video/mp4" }));
        player.src = videoObjectUrl;
        player.hidden = false;
        status.hidden = true;
        player.play().catch(() => {});
    } catch (error) {
        if (!current()) return;
        status.hidden = false;
        status.textContent = "영상을 열 수 없습니다: " + error.message;
    }
}

document.getElementById("videoClose").onclick = closeRankVideo;
document.getElementById("videoModal").addEventListener("click", event => {
    if (event.target.id === "videoModal") closeRankVideo();
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !document.getElementById("videoModal").hidden) {
        closeRankVideo();
    }
});

function row(label, value, cls) {
    const r = el("div", "metric");
    const l = el("span", "label", label);
    l.title = label;
    r.appendChild(l);
    r.appendChild(el("span", "value " + (cls || ""), value));
    return r;
}

function fmt(v) {
    if (v === null || v === undefined) return "-";
    if (typeof v !== "number") return String(v);
    if (v === 0) return "0.00000";
    const a = Math.abs(v);
    if (a >= 10000 || a < 0.0001) return v.toExponential(3);
    return v.toFixed(5);
}

const ALERT_STATE_KEY = "rl-dashboard-alert-state-v1";
let latestAlertData = null;

function loadAlertState() {
    try {
        const parsed = JSON.parse(localStorage.getItem(ALERT_STATE_KEY) || "{}");
        return {
            read: parsed.read && typeof parsed.read === "object" ? parsed.read : {},
            deleted: parsed.deleted && typeof parsed.deleted === "object"
                ? parsed.deleted : {},
        };
    } catch (_) {
        return { read: {}, deleted: {} };
    }
}

let alertState = loadAlertState();

function saveAlertState() {
    // Keep state bounded even if this dashboard runs for years.
    for (const key of ["read", "deleted"]) {
        const entries = Object.entries(alertState[key])
            .sort((a, b) => Number(b[1]) - Number(a[1]))
            .slice(0, 500);
        alertState[key] = Object.fromEntries(entries);
    }
    try {
        localStorage.setItem(ALERT_STATE_KEY, JSON.stringify(alertState));
    } catch (_) {
        // Private browsing/storage denial should not break monitoring.
    }
}

function fallbackAlertId(a) {
    const source = [a.ts, a.key, a.level, a.message].join("|");
    let hash = 2166136261;
    for (let i = 0; i < source.length; i++) {
        hash ^= source.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
    }
    return "legacy-" + (hash >>> 0).toString(16);
}

function alertId(a) {
    return a.id || fallbackAlertId(a);
}

function alertButton(label, title, onClick, danger) {
    const button = el("button", "alert-btn" + (danger ? " danger" : ""), label);
    button.type = "button";
    button.title = title;
    button.onclick = onClick;
    return button;
}

function rerenderAlerts() {
    if (latestAlertData) renderAlerts(latestAlertData);
}

function renderAlerts(data) {
    latestAlertData = data;
    const box = document.getElementById("alertbox");
    box.textContent = "";

    const active = (data.alerts || [])
        .filter(a => a.level !== "resolved")
        .slice(-20)
        .reverse();
    if (!active.length) return;

    const visible = active.filter(a => !alertState.deleted[alertId(a)]);
    const unread = visible.filter(a => !alertState.read[alertId(a)]).length;
    const deleted = active.length - visible.length;

    const card = el("section", "card wide alert-card");
    const header = el("div", "alert-header");
    const heading = el("div", "alert-heading");
    heading.appendChild(el("div", "card-title", "ALERTS"));
    heading.appendChild(el("span", "alert-count",
        "안 읽음 " + unread + " · 표시 " + visible.length));
    header.appendChild(heading);

    const tools = el("div", "alert-tools");
    if (unread) {
        tools.appendChild(alertButton("모두 읽음", "표시된 알림을 모두 읽음 처리", () => {
            const now = Date.now();
            for (const a of visible) alertState.read[alertId(a)] = now;
            saveAlertState();
            rerenderAlerts();
        }));
    }
    if (visible.some(a => alertState.read[alertId(a)])) {
        tools.appendChild(alertButton("읽은 알림 삭제", "읽음 처리한 알림을 화면에서 숨김", () => {
            const now = Date.now();
            for (const a of visible) {
                const id = alertId(a);
                if (alertState.read[id]) alertState.deleted[id] = now;
            }
            saveAlertState();
            rerenderAlerts();
        }, true));
    }
    if (deleted) {
        tools.appendChild(alertButton("삭제 복구 " + deleted, "삭제한 알림을 다시 표시", () => {
            for (const a of active) delete alertState.deleted[alertId(a)];
            saveAlertState();
            rerenderAlerts();
        }));
    }
    header.appendChild(tools);
    card.appendChild(header);

    const list = el("div", "alert-list");
    if (!visible.length) {
        list.appendChild(el("div", "alert-empty", "표시할 알림이 없습니다."));
    }

    for (const a of visible) {
        const id = alertId(a);
        const isRead = !!alertState.read[id];
        const item = el("article", "alert-item " + (isRead ? "read" : "unread"));
        item.dataset.alertId = id;

        const main = el("div", "alert-main");
        const meta = el("div", "alert-meta");
        meta.appendChild(el("span", "alert-level " + (a.level || "warning"),
                            a.level || "warning"));
        meta.appendChild(el("span", "", a.ts_text || "시간 미상"));
        if (isRead) meta.appendChild(el("span", "", "읽음"));
        main.appendChild(meta);
        main.appendChild(el("div", "alert-message", a.message || "내용 없음"));
        item.appendChild(main);

        const actions = el("div", "alert-actions");
        actions.appendChild(alertButton(
            isRead ? "안 읽음" : "읽음",
            isRead ? "이 알림을 안 읽음으로 표시" : "이 알림을 읽음 처리",
            () => {
                if (isRead) delete alertState.read[id];
                else alertState.read[id] = Date.now();
                saveAlertState();
                rerenderAlerts();
            }));
        actions.appendChild(alertButton("삭제", "이 브라우저에서 알림 숨기기", () => {
            alertState.deleted[id] = Date.now();
            saveAlertState();
            rerenderAlerts();
        }, true));
        item.appendChild(actions);
        list.appendChild(item);
    }
    card.appendChild(list);
    box.appendChild(card);
}

function nodeLabel(name) {
    const match = String(name).match(/pc[-_ ]?0*(\d+)$/i);
    return match ? "PC" + Number(match[1]) : name;
}

function primaryProcess(node) {
    const processes = ((node || {}).training || {}).processes || [];
    if (!processes.length) return {};

    const marked = processes.find(p => p && p.primary === true);
    if (marked) return marked;

    // Rolling upgrades may briefly expose an older worker payload without the
    // primary marker.  A lower elapsed time is the runner started most
    // recently, independent of checkpoint numbering or project name.
    return processes.reduce((best, candidate) => {
        const bestElapsed = Number(best && best.elapsed_sec);
        const candidateElapsed = Number(candidate && candidate.elapsed_sec);
        const b = Number.isFinite(bestElapsed) ? bestElapsed : Infinity;
        const c = Number.isFinite(candidateElapsed) ? candidateElapsed : Infinity;
        return c < b ? candidate : best;
    }, processes[0] || {});
}

function trainingProcesses(node) {
    const processes = [...((((node || {}).training || {}).processes) || [])];
    const primary = primaryProcess(node);
    return processes.sort((a, b) => {
        if (a === primary) return -1;
        if (b === primary) return 1;
        const ae = Number(a && a.elapsed_sec);
        const be = Number(b && b.elapsed_sec);
        return (Number.isFinite(ae) ? ae : Infinity)
             - (Number.isFinite(be) ? be : Infinity);
    });
}

function processItem(process, isPrimary) {
    const p = process || {};
    const exp = p.experiment || {};
    const tb = p.tensorboard_metrics || {};
    const ck = p.latest_checkpoint || {};
    const item = el("div", "process-item" + (isPrimary ? " primary" : ""));

    const head = el("div", "process-head");
    const name = el("div", "process-name", p.project || p.script || "Training process");
    name.title = p.command || p.project || "";
    head.appendChild(name);
    head.appendChild(el(
        "span", "process-role" + (isPrimary ? " primary" : ""),
        isPrimary ? "대시보드 추적" : "추가 실행"));
    item.appendChild(head);

    item.appendChild(row("Experiment", exp.name || "탐지 중", exp.name ? "blue" : ""));
    item.appendChild(row("PID", p.pid !== undefined ? String(p.pid) : "-"));
    item.appendChild(row("Runtime", p.elapsed_human || "-"));
    item.appendChild(row(
        "Step",
        tb.current_logged_step !== undefined && tb.current_logged_step !== null
            ? String(tb.current_logged_step) : "-", "blue"));
    item.appendChild(row("Checkpoint", ck.name || ck.checkpoint_name || "-"));
    const progress = p.training_progress || {};
    const maximum = progress.max_iterations;
    item.appendChild(row("최대 iteration", Number.isFinite(maximum) ? maximum.toLocaleString() : "확인 불가"));
    if (Number.isFinite(progress.progress_percent))
        item.appendChild(row("학습 진행률", progress.progress_percent.toFixed(1) + " %"));
    // Transport/CDN age is not evidence that the training itself stalled.
    const sampleAge = Number.isFinite(progress.sampled_at)
        ? Math.max(0, Date.now() / 1000 - progress.sampled_at) : null;
    const publicationDelayed = sampleAge !== null && sampleAge > 180;
    const stale = tb.stale || p.ended_observed_at || sampleAge === null;
    let eta = "계산 중 · 속도 수집 중", finish = "-";
    if (stale || progress.status === 'unavailable') eta = "예측 불가 · 상태 갱신 필요";
    else if (progress.status === 'target_unknown') eta = "예측 불가 · 최대값 미확인";
    else if (progress.status === 'target_reached') eta = "목표 iteration 도달 · 종료 처리 중";
    else if (progress.status === 'estimated' && Number.isFinite(progress.remaining_seconds)) {
        const minutes = Math.max(1, Math.ceil(progress.remaining_seconds / 60));
        eta = "약 " + (minutes >= 60 ? Math.floor(minutes / 60) + "시간 " : "") + (minutes % 60) + "분";
        finish = new Date(progress.estimated_finish_at * 1000).toLocaleString('ko-KR', {
            timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
        }) + " KST";
        if (publicationDelayed) {
            // Keep the last measured estimate, not a fabricated countdown.
            eta += " · 마지막 수집 기준";
            finish += " · 갱신 지연";
        }
    }
    item.appendChild(row("학습 완료까지", eta));
    item.appendChild(row("예상 완료 시각", finish));
    if (publicationDelayed) item.appendChild(row("예측 데이터", 
        Math.floor(sampleAge / 60) + "분 전 수집 · 현재 학습 상태 미확인", "warn"));
    const sources = tb.sources || {};
    const sourceNames = [];
    if (sources.tensorboard) sourceNames.push("TensorBoard");
    if (sources.training_log) sourceNames.push("Training log");
    item.appendChild(row("Metrics Source", sourceNames.join(" + ") || "-"));
    return item;
}

function visibleMetricNames(metrics, nodeName) {
    return Object.keys(metrics || {})
        .filter(name => !(nodeLabel(nodeName) === "PC2" && name.endsWith("/mean")))
        .sort();
}

function systemCard(n) {
    const sys = el("div", "card");
    sys.appendChild(el("div", "card-title", "SYSTEM"));
    sys.appendChild(row("Hostname", n.hostname || "-"));
    sys.appendChild(row("CPU", (n.cpu_percent || 0).toFixed(1) + " %"));
    sys.appendChild(row("RAM", (n.ram_percent || 0).toFixed(1) + " %"));
    const g = (n.gpus || [])[0] || {};
    sys.appendChild(row("GPU", g.name || "-"));
    sys.appendChild(row("VRAM",
        g.memory_used !== undefined
            ? Math.round(g.memory_used) + " / " + Math.round(g.memory_total) + " MiB"
            : "-"));
    sys.appendChild(row("GPU Temp",
        g.temperature !== undefined ? g.temperature + " C" : "-"));
    return sys;
}

function trainingCard(n, uncertain) {
    const processes = trainingProcesses(n);
    const primary = primaryProcess(n);
    const job = el("div", "card training-card" +
        (processes.length > 1 ? " concurrent" : ""));
    const title = el("div", "card-title-line");
    title.appendChild(el("div", "card-title", "TRAINING PROCESSES"));
    title.appendChild(el("div", "run-count", processes.length + (uncertain ? " · 마지막 수신 상태" : " RUNNING")));
    job.appendChild(title);

    if (processes.length > 1) {
        job.appendChild(el(
            "div", "concurrent-notice",
            "동일 PC에서 학습 " + processes.length + "개가 동시에 실행 중입니다."));
    }
    if (!processes.length) {
        job.appendChild(el("div", "alert-empty", "실행 중인 학습 프로세스가 없습니다."));
        return job;
    }

    const list = el("div", "process-list");
    for (const process of processes) {
        list.appendChild(processItem(process, process === primary));
    }
    job.appendChild(list);
    return job;
}

function renderNodes(data) {
    const host = document.getElementById("nodes");
    host.textContent = "";
    host.className = "node-summaries";

    for (const name of Object.keys(data.status || {}).sort()) {
        const n = data.status[name] || {};
        const running = !!(n.training || {}).running;
        const processCount = trainingProcesses(n).length;
        const section = el("section", "node-summary");

        const head = el("div", "node-head");
        const identity = el("div", "node-identity");
        const link = el("button", "node-link");
        link.type = "button";
        link.title = nodeLabel(name) + " 상세 화면 열기";
        link.setAttribute("aria-label", nodeLabel(name) + " 상세 보기");
        link.appendChild(el("span", "node-name", nodeLabel(name)));
        link.appendChild(el("span", "node-source", name));
        link.appendChild(el("span", "node-open", "상세 보기 →"));
        link.onclick = () => navigateToNode(name);
        identity.appendChild(link);
        const statusClass = nodeAvailability(data, name) || processCount > 1 ? "warn" : (running ? "on" : "off");
        const statusText = nodeAvailability(data, name) || (running
            ? "RUNNING · " + processCount + (processCount === 1 ? " JOB" : " JOBS")
            : "STOPPED");
        identity.appendChild(el("div", "badge " + statusClass, statusText));
        head.appendChild(identity);
        section.appendChild(head);

        const grid = el("div", "grid");
        grid.appendChild(systemCard(n));
        grid.appendChild(trainingCard(n, !!nodeAvailability(data, name)));
        section.appendChild(grid);
        host.appendChild(section);
    }
}

    host.textContent = "";
    const n = (data.status || {})[nodeName] || {};
    const p = selectedRunProcess(data, nodeName);
    const metrics = (p.tensorboard_metrics || {}).metrics || {};
    const names = visibleMetricNames(metrics, nodeName);

    const body = collapsibleSection(
        host, "metrics", "Training Metrics", String(names.length));

    const contract = p.run_contract || {};
    const statusCard = el("div", "card");
    statusCard.appendChild(el("div", "card-title", "실행 구성 · 자동 생성"));
    const stateText = contract.status === "supported" ? "자동 생성 가능" :
        contract.origin === "training_runtime" ? "어댑터 검증 필요" : "기존 실행 · 명세 없음";
    statusCard.appendChild(row("호환성", stateText));
    statusCard.appendChild(el("div", "video-unavailable", contract.reason ||
        "새 학습부터 실행 명세가 기록됩니다. 기존 학습의 지표와 기록은 유지됩니다."));
    const dims = contract.dimensions || {};
    if (dims.observation != null) statusCard.appendChild(row("관측 / 행동", dims.observation + " / " + dims.action));
    if (contract.comparison_id) statusCard.appendChild(row("평가 비교 그룹", contract.comparison_id.slice(0, 12)));
    if (contract.reward_version) statusCard.appendChild(row("리워드 구성 버전", contract.reward_version.slice(0, 12)));
    const repair = p.adapter_repair;
    if (repair) {
        const labels = {QUEUED:"수정 후보 대기", GENERATING:"수정 후보 작성 중",
            NEEDS_REFERENCE_VALIDATOR:"독립 검증 기준 필요", NEEDS_INFORMATION:"추가 정보 필요",
            NEEDS_REVIEW:"수동 검토 필요", VALIDATION_FAILED:"검증 실패 · 미적용",
            AWAITING_USER_APPROVAL:"검증 통과 · 사용자 승인 대기", APPLIED:"승인된 버전 적용됨",
            ROLLED_BACK:"이전 연결 복구 · 호환성 재확인 필요"};
        statusCard.appendChild(row("어댑터 처리", labels[repair.status] || repair.status || "상태 확인 필요"));
        if (repair.candidate_id) statusCard.appendChild(row("수정 후보", repair.candidate_id));
        if (repair.bundle_sha256) statusCard.appendChild(row("후보 버전", repair.bundle_sha256.slice(0, 12)));
        if (repair.reason) statusCard.appendChild(el("div", "video-unavailable", repair.reason));
        for (const [check, result] of Object.entries(repair.checks || {})) {
            statusCard.appendChild(row(check, result));
        }
        statusCard.appendChild(el("div", "video-unavailable", "실제 로봇 배포 안전성 검증과는 별개입니다. 적용·복구 승인은 Telegram에서 진행합니다."));
    }
    body.appendChild(statusCard);

    if (!names.length) {
        body.appendChild(el("div", "card empty-card", "표시할 트레이닝 매트릭스가 없습니다."));
        return;
    }

    const card = el("div", "card");
    const inner = el("div");
    inner.style.display = "grid";
    inner.style.gridTemplateColumns = "repeat(auto-fill, minmax(300px, 1fr))";
    inner.style.gap = "0 28px";
    const catalog = p.metric_catalog || {};
    const metricGroups = {};
    for (const k of names) {
        const group = (catalog[k] || {}).group || ("reward" === k.slice(0, 6) ? "reward" : "training");
        if (!metricGroups[group]) {
            const section = el("div");
            section.style.minWidth = "0";
            section.appendChild(el("div", "card-title", group));
            inner.appendChild(section);
            metricGroups[group] = section;
        }
        const v = metrics[k] && metrics[k].value;
        let cls = "";
        if (k.indexOf("reward") === 0 && typeof v === "number") {
            cls = v >= 0 ? "green" : "red";
        }
        const meta = catalog[k] || {};
        metricGroups[meta.group || ("reward" === k.slice(0, 6) ? "reward" : "training")]
            .appendChild(row(meta.label || k, fmt(v) + (meta.unit ? " " + meta.unit : ""), cls));
    }
    card.appendChild(inner);
    body.appendChild(card);
}

const expandedSections = {
    metrics: sessionStorage.getItem("rl_section_metrics") === "expanded",
    history: sessionStorage.getItem("rl_section_history") === "expanded"
};

function collapsibleSection(host, key, title, badgeText) {
    const head = el("div", "node-head");
    head.appendChild(el("div", "node-name", title));

    const actions = el("div", "section-head-actions");
    if (badgeText) actions.appendChild(el("div", "badge", badgeText));

    const body = el("div");
    body.id = key + "-content";

    const toggle = el("button", "section-toggle");
    toggle.type = "button";
    toggle.setAttribute("aria-controls", body.id);

    function sync() {
        const expanded = expandedSections[key];
        body.hidden = !expanded;
        toggle.textContent = expanded ? "숨기기" : "펼치기";
        toggle.setAttribute("aria-expanded", String(expanded));
        toggle.setAttribute("aria-label", title + (expanded ? " 숨기기" : " 펼치기"));
    }

    toggle.onclick = () => {
        expandedSections[key] = !expandedSections[key];
        sessionStorage.setItem(
            "rl_section_" + key,
            expandedSections[key] ? "expanded" : "collapsed");
        sync();
    };

    actions.appendChild(toggle);
    head.appendChild(actions);
    host.appendChild(head);
    host.appendChild(body);
    sync();
    return body;
}

const SVGNS = "http://www.w3.org/2000/svg";

function svgEl(tag, attrs) {
    const n = document.createElementNS(SVGNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
}

// One metric, drawn small. Deliberately dependency-free: a chart library would
// mean a CDN request from whatever network the viewer is on, and these are
// simple line plots.
function sparkline(steps, values, w, h) {
    const pad = 4;
    const svg = svgEl("svg", { viewBox: "0 0 " + w + " " + h,
                               width: "100%", height: h });

    const valid = values.filter(v => typeof v === "number");
    if (!valid.length) return svg;

    let lo = Math.min(...valid), hi = Math.max(...valid);
    if (hi === lo) { hi = lo + 1; lo = lo - 1; }

    const x0 = steps[0], x1 = steps[steps.length - 1];
    const span = x1 - x0;
    const px = span === 0
        ? () => w / 2
        : (s) => pad + (s - x0) / span * (w - 2 * pad);
    const py = (v) => h - pad - (v - lo) / (hi - lo) * (h - 2 * pad);

    // Zero line, but only when the data actually straddles it — otherwise it
    // sits on an edge and just adds noise.
    if (lo < 0 && hi > 0) {
        svg.appendChild(svgEl("line", {
            x1: pad, x2: w - pad, y1: py(0), y2: py(0),
            stroke: "#30363d", "stroke-width": 1 }));
    }

    // Gaps: a metric that appeared late has leading nulls, and breaking the
    // path there is more honest than interpolating across them.
    let d = "", pen = false;
    for (let i = 0; i < values.length; i++) {
        const v = values[i];
        if (typeof v !== "number") { pen = false; continue; }
        d += (pen ? "L" : "M") + px(steps[i]).toFixed(1) + " "
             + py(v).toFixed(1) + " ";
        pen = true;
    }

    const last = valid[valid.length - 1];
    svg.appendChild(svgEl("path", {
        d: d, fill: "none", "stroke-width": 1.5,
        stroke: last >= 0 ? "#3fb950" : "#f85149" }));

    // A resumed or already-completed run may be observed only once. Show the
    // real sample as a point instead of claiming there is no history.
    for (let index = 0; index < values.length; index++) {
        if (!Number.isFinite(values[index])) continue;
        svg.appendChild(svgEl("circle", {
            cx: px(steps[index]), cy: py(values[index]), r: 1.5,
            fill: last >= 0 ? "#3fb950" : "#f85149" }));
    }

    return svg;
}

function renderHistory(data, nodeName) {
    const host = document.getElementById("charts");
    host.textContent = "";
    const selected = selectedRuns[nodeName];
    const currentHistory = (data.history || {})[nodeName] || {};
    const h = selected && selected !== currentHistory.experiment
        ? ((((data.history || {})._archives || {})[nodeName] || {})[selected] || {})
        : currentHistory;
    const steps = h.steps || [];
    const series = h.series || {};
    const names = visibleMetricNames(series, nodeName);

    const historyLabel = steps.length
        ? (steps.length === 1
            ? "수집 1점 · " + steps[0]
            : steps[0] + " → " + steps[steps.length - 1])
        : "";
    const body = collapsibleSection(
        host, "history", "Training History", historyLabel);

    if (!steps.length || !names.length) {
        body.appendChild(el("div", "card empty-card", "표시할 트레이닝 추이가 없습니다."));
        return;
    }

    const card = el("div", "card");
    const grid = el("div");
    grid.style.display = "grid";
    grid.style.gridTemplateColumns = "repeat(auto-fill, minmax(260px, 1fr))";
    grid.style.gap = "18px";

    for (const name of names) {
        const points = (h.points || {})[name];
        const plotSteps = points ? points.map(p => p.step) : steps;
        const values = points ? points.map(p => p.value) : series[name];
        const valid = values.filter(v => typeof v === "number");
        if (!valid.length) continue;

        const box = el("div");
        const top = el("div", "metric");
        top.style.borderBottom = "none";
        top.style.padding = "0 0 4px";
        const lab = el("span", "label", name);
        lab.title = name;
        const last = valid[valid.length - 1];
        top.appendChild(lab);
        top.appendChild(el("span",
            "value " + (name.indexOf("reward") === 0
                        ? (last >= 0 ? "green" : "red") : ""),
            fmt(last)));
        box.appendChild(top);
        box.appendChild(sparkline(plotSteps, values, 260, 60));
        grid.appendChild(box);
    }

    card.appendChild(grid);
    body.appendChild(card);
}

function videoStatusText(node, experiment, checkpoint) {
    const state = node.video_watcher || {};
    if (state.status === "failed" && (!state.experiment || state.experiment === experiment))
        return "영상 생성 오류: " + (state.error || "감시기 확인 필요");
    if (state.experiment !== experiment || state.checkpoint !== checkpoint)
        return "영상 미등록 · 생성 요청 확인 필요";
    if (Date.now() / 1000 - state.updated_at > 360)
        return "영상 감시 상태 오래됨 · 확인 필요";
    return {compatibility_blocked: "환경 변경 감지 · 영상 어댑터 검증 필요", generating: "테스트 영상 생성 중", uploading: "영상 업로드 중",
            uploaded: "영상 업로드 완료 · 게시 반영 중"}[state.status] || "영상 대기 중";
}

function renderRanking(data, nodeName) {
    const host = document.getElementById("rank");
    host.textContent = "";
    const n = (data.status || {})[nodeName] || {};
    const currentExperiment = (primaryProcess(n).experiment || {}).name;
    const perNode = (data.rankings || {})[nodeName];
    const experiment = selectedRuns[nodeName] || currentExperiment || (perNode || {}).experiment;
    const catalog = (data.runs || {})[nodeName] || [];
    const candidate = (perNode && perNode.experiment === experiment)
        ? perNode : catalog.find(r => r && r.experiment === experiment);
    const r = candidate && candidate.node_name === nodeName && candidate.run_id === experiment
        ? candidate : null;
    const media = data.rank_videos || {};
    const videos = (((media._runs || {})[nodeName] || {})[experiment]) || media[nodeName] || {};
    const selectedProcess = selectedRunProcess(data, nodeName);
    const noFixedEvaluation = (selectedProcess.capabilities ||
        (selectedProcess.run_contract || {}).capabilities || {}).fixed_evaluation === false;
    const saved = selectedProcess.latest_checkpoint;
    const belongsToRun = (selectedProcess.experiment || {}).name === experiment;
    const latestSaved = belongsToRun && saved && /^full_\d+\.pt$/.test(saved.name || '')
        ? {node_name: nodeName, run_id: experiment, checkpoint: saved.name,
           iteration: saved.iteration, checkpoint_sha256: saved.sha256,
           verified: false, artifact_only: true} : null;
    const rankedLatest = r && r.latest;
    const latest = latestSaved && (!rankedLatest || latestSaved.iteration > rankedLatest.iteration)
        ? latestSaved : (rankedLatest || latestSaved);

    const head = el("div", "node-head");
    head.appendChild(el("div", "node-name", "Checkpoint Ranking"));
    if (experiment) head.appendChild(el("div", "badge", experiment));
    host.appendChild(head);

    if (!r || r.error || ![r.latest, r.best_reward, r.best_vx_rmse].some(Boolean)) {
        host.appendChild(el("div", "card empty-card",
                            noFixedEvaluation ? "고정 평가 미설정 · 최신 체크포인트는 평가와 별도로 표시합니다."
                            : "평가가 완료된 체크포인트 랭킹이 없습니다."));
    } else if (!r.verified_count) {
        host.appendChild(el("div", "card empty-card",
            "기존 체크포인트와 점수는 보존되어 있습니다. BEST는 동일 조건에서 체크포인트·정규화 파일과의 연결이 검증된 평가로만 선정합니다."));
    }
    const grid = el("div", "grid");
    const cards = [
        ["LATEST", "latest", latest],
        ["BEST REWARD", "best_reward", !noFixedEvaluation && r && r.best_reward],
        ["BEST VX RMSE", "best_vx_rmse", !noFixedEvaluation && r && r.best_vx_rmse],
    ];
    for (const [title, slot, v] of cards) {
        const c = el("div", "card");
        c.appendChild(el("div", "card-title", title));
        const descriptions = {
            latest: "가장 최근에 저장된 체크포인트",
            best_reward: "검증된 평가 리워드가 가장 높은 체크포인트",
            best_vx_rmse: "검증된 전진 속도 추종 오차가 가장 작은 체크포인트",
        };
        c.appendChild(el("div", "video-unavailable", descriptions[slot]));
        if (!v || v.node_name !== nodeName || v.run_id !== experiment) {
            if (slot === 'latest' || noFixedEvaluation) {
                c.appendChild(row('상태', slot === 'latest' ? '저장된 체크포인트 없음' : '고정 평가 미설정'));
                c.appendChild(el('div', 'video-unavailable', slot === 'latest'
                    ? '선택한 학습에서 수집된 체크포인트가 아직 없습니다.'
                    : '평가 점수가 없어 BEST를 선정하지 않습니다.'));
                grid.appendChild(c);
                continue;
            }
            const unavailable = !r || r.error;
            c.appendChild(row("상태", unavailable ? "랭킹 데이터 확인 필요" :
                slot === "latest" ? "체크포인트 대기" : "검증 대기 · BEST 미선정"));
            c.appendChild(el("div", "video-unavailable", unavailable
                ? "선택한 학습의 랭킹 데이터를 아직 확인할 수 없습니다."
                : slot === "latest" ? "수집된 체크포인트가 아직 없습니다."
                : "선정 조건을 충족한 평가가 없습니다. 기존 체크포인트는 재평가가 필요하며, 이 표시는 재평가 작업이 자동 실행 중이라는 뜻은 아닙니다."));
            grid.appendChild(c);
            continue;
        }
        c.appendChild(row("Checkpoint", v.checkpoint || "-", "blue"));
        c.appendChild(row("Iteration", String(v.iteration)));
        if (!v.artifact_only && !noFixedEvaluation) {
            c.appendChild(row("Fixed-eval Reward", fmt(v.reward), "green"));
            c.appendChild(row("VX RMSE", fmt(v.vx_rmse)));
        }
        c.appendChild(row("평가", noFixedEvaluation ? '고정 평가 미설정' :
            v.artifact_only ? '평가 결과 없음' : v.verified ? "검증됨" : "미검증 · 참고값"));
        const video = videos[slot];
        const videoMatches = video && video.node_name === nodeName &&
            video.run_id === experiment && video.checkpoint === v.checkpoint &&
            (!v.checkpoint_sha256 || video.checkpoint_sha256 === v.checkpoint_sha256);
        if (videoMatches) {
            const button = el("button", "video-btn", "테스트 영상 보기");
            button.type = "button";
            button.onclick = () => openRankVideo(videos[slot], nodeName, title);
            c.appendChild(button);
        } else {
            c.appendChild(el("div", "video-unavailable", video ? "영상 식별정보 불일치 · 재생 보류" : videoStatusText(n, experiment, v.checkpoint)));
        }
        grid.appendChild(c);
    }
    host.appendChild(grid);
}

let latestDashboardData = null;
let refreshError = null;
let lastSuccessAt = null;
const selectedRuns = {};

function nodeAvailability(data, name) {
    const n = (data.status || {})[name] || {};
    const health = (((data.health || {}).nodes || {})[name] || {});
    const elapsed = Math.max(0, Date.now() / 1000 - (data.generated_at || 0));
    const age = (health.heartbeat_age_sec ?? Infinity) + elapsed;
    if (refreshError) return "갱신 실패 · 상태 미확인";
    if (elapsed > 180) return "데이터 오래됨 · 상태 미확인";
    if (health.status === "OFFLINE" || age > 60) return "OFFLINE · 학습 상태 미확인";
    return null;
}

function selectedRunProcess(data, nodeName) {
    const node = (data.status || {})[nodeName] || {};
    const current = primaryProcess(node);
    const selected = selectedRuns[nodeName];
    const completed = ((node.training || {}).completed_runs) || [];
    if (!selected) return current.experiment ? current : (completed[0] || current);
    if (selected === (current.experiment || {}).name) return current;
    return completed
        .find(p => (p.experiment || {}).name === selected) || {};
}

function updateFreshness() {
    if (!latestDashboardData) return;
    const age = Math.max(0, Math.round(Date.now() / 1000 - latestDashboardData.generated_at));
    const stamp = document.getElementById("stamp");
    stamp.textContent = "게시 " + (latestDashboardData.generated_at_text || "-") +
        " · 데이터 경과 " + age + "초" +
        (refreshError ? " · 갱신 실패: " + refreshError : "") +
        (lastSuccessAt ? " · 마지막 수신 " + new Date(lastSuccessAt).toLocaleTimeString() : "");
    stamp.style.color = refreshError || age > 180 ? "#f85149" : "";
    // Only redraw status summaries: preserve an open video and run selection.
    if (!selectedNodeFromHash(latestDashboardData)) renderNodes(latestDashboardData);
    else {
        const badge = document.getElementById("detail-health");
        const name = selectedNodeFromHash(latestDashboardData);
        if (badge) badge.textContent = nodeAvailability(latestDashboardData, name) ||
            (((latestDashboardData.status[name] || {}).training || {}).running ? "RUNNING" : "STOPPED");
    }
}
setInterval(updateFreshness, 1000);

const DASHBOARD_REFRESH_MS = 30000;
let refreshPromise = null;

function selectedNodeFromHash(data) {
    if (!location.hash.startsWith("#node=")) return null;
    let name;
    try {
        name = decodeURIComponent(location.hash.slice(6));
    } catch (_) {
        return null;
    }
    return Object.prototype.hasOwnProperty.call(data.status || {}, name) ? name : null;
}

function navigateToNode(name) {
    const next = "#node=" + encodeURIComponent(name);
    if (location.hash === next && latestDashboardData) {
        renderDashboard(latestDashboardData);
    } else {
        location.hash = next;
    }
}

function navigateToOverview() {
    if (location.hash === "#overview" && latestDashboardData) {
        renderDashboard(latestDashboardData);
    } else {
        location.hash = "#overview";
    }
}

function renderDetailHead(data, nodeName) {
    const host = document.getElementById("detailhead");
    host.textContent = "";

    const toolbar = el("div", "detail-toolbar");
    const back = el("button", "nav-btn", "← 전체 현황");
    back.type = "button";
    back.onclick = navigateToOverview;
    toolbar.appendChild(back);

    const nav = el("div", "detail-nav");
    for (const name of Object.keys(data.status || {}).sort()) {
        const button = el("button", "nav-btn" + (name === nodeName ? " active" : ""),
                          nodeLabel(name));
        button.type = "button";
        button.setAttribute("aria-label", nodeLabel(name) + " 상세 보기");
        if (name === nodeName) button.setAttribute("aria-current", "page");
        button.onclick = () => navigateToNode(name);
        nav.appendChild(button);
    }
    toolbar.appendChild(nav);
    host.appendChild(toolbar);

    const n = (data.status || {})[nodeName] || {};
    const running = !!(n.training || {}).running;
    const processCount = trainingProcesses(n).length;
    const title = el("div", "detail-title");
    title.appendChild(el("div", "node-name", nodeLabel(nodeName)));
    title.appendChild(el("div", "node-source", nodeName));
    const healthBadge = el("div", "badge",
        nodeAvailability(data, nodeName) || (running
            ? "RUNNING · " + processCount + " JOBS" : "STOPPED"));
    healthBadge.id = "detail-health";
    title.appendChild(healthBadge);
    host.appendChild(title);
    const selector = el("select", "nav-btn");
    selector.setAttribute("aria-label", "실험 선택");
    const live = (primaryProcess(n).experiment || {}).name;
    selector.appendChild(el("option", "", live ? "현재 실행 · " + live : "최근 실행"));
    selector.children[0].value = "";
    for (const run of (data.runs || {})[nodeName] || []) {
        if (!run || run.experiment === live) continue;
        const option = el("option", "", run.experiment);
        option.value = run.experiment;
        selector.appendChild(option);
    }
    selector.value = selectedRuns[nodeName] || "";
    selector.onchange = () => {
        selectedRuns[nodeName] = selector.value;
        renderDashboard(latestDashboardData);
    };
    host.appendChild(selector);
}

function renderRunningProcesses(data, nodeName) {
    const host = document.getElementById("jobs");
    host.textContent = "";
    host.className = "process-section";

    const n = (data.status || {})[nodeName] || {};
    const processes = trainingProcesses(n);
    const primary = primaryProcess(n);

    const head = el("div", "node-head");
    head.appendChild(el("div", "node-name", "Running Processes"));
    head.appendChild(el(
        "div", "badge " + (processes.length > 1 ? "warn" : ""),
        String(processes.length)));
    host.appendChild(head);

    if (!processes.length) {
        host.appendChild(el("div", "card empty-card", "실행 중인 학습 프로세스가 없습니다."));
        return;
    }

    if (processes.length > 1) {
        host.appendChild(el(
            "div", "concurrent-notice",
            "주의: 동일 PC에서 학습 " + processes.length +
            "개가 동시에 실행 중입니다. 각 PID와 실험명을 확인하세요."));
    }

    const grid = el("div", "process-grid");
    for (const process of processes) {
        grid.appendChild(processItem(process, process === primary));
    }
    host.appendChild(grid);
}

function renderDashboard(data) {
    latestDashboardData = data;
    const nodeName = selectedNodeFromHash(data);
    const overview = document.getElementById("overview");
    const detail = document.getElementById("detail");

    if (nodeName) {
        overview.style.display = "none";
        detail.style.display = "";
        renderDetailHead(data, nodeName);
        renderRunningProcesses(data, nodeName);
        renderMetrics(data, nodeName);
        renderHistory(data, nodeName);
        renderRanking(data, nodeName);
    } else {
        detail.style.display = "none";
        overview.style.display = "";
        renderAlerts(data);
        renderNodes(data);
    }
}

window.addEventListener("hashchange", () => {
    if (latestDashboardData) renderDashboard(latestDashboardData);
});

let passphrase = sessionStorage.getItem("rl_pass") || "";

async function load() {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("data.json 을 불러오지 못했습니다 (" + res.status + ")");
    const envelope = await res.json();
    const data = await decrypt(envelope, passphrase);
    latestEnvelope = envelope;
    lastSuccessAt = Date.now();
    refreshError = null;

    const generatedAt = Number(data.generated_at);
    const ageSeconds = Number.isFinite(generatedAt)
        ? Math.max(0, Math.round(Date.now() / 1000 - generatedAt)) : null;
    document.getElementById("stamp").textContent =
        "갱신 " + (data.generated_at_text || "-") +
        (ageSeconds === null ? "" : "  ·  데이터 지연 " + ageSeconds + "초") +
        "  ·  화면 " + new Date().toLocaleTimeString();
    renderDashboard(data);
}

function refreshDashboard() {
    if (!passphrase || refreshPromise) return refreshPromise;
    refreshPromise = load()
        .catch(error => { refreshError = error.message; updateFreshness(); })
        .finally(() => { refreshPromise = null; });
    return refreshPromise;
}

async function open_() {
    const err = document.getElementById("err");
    err.textContent = "복호화 중...";
    passphrase = document.getElementById("pass").value;
    try {
        await load();
        sessionStorage.setItem("rl_pass", passphrase);
        document.getElementById("gate").style.display = "none";
        document.getElementById("app").style.display = "";
        // The publisher runs at most once a minute. Polling every 30 seconds
        // catches the next deployment quickly, while refreshPromise prevents
        // overlapping decryptions on slow devices.
        setInterval(refreshDashboard, DASHBOARD_REFRESH_MS);
    } catch (e) {
        // A wrong passphrase fails the GCM tag check, which lands here.
        err.textContent = "암호가 틀렸거나 데이터를 읽을 수 없습니다.";
        sessionStorage.removeItem("rl_pass");
    }
}

document.getElementById("go").onclick = open_;
document.getElementById("pass").addEventListener("keydown", e => {
    if (e.key === "Enter") open_();
});

// Background tabs throttle timers. Refresh immediately when the dashboard is
// brought back instead of leaving the last training session visible until the
// next interval happens to fire.
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshDashboard();
});
window.addEventListener("focus", refreshDashboard);

if (passphrase) {
    document.getElementById("pass").value = passphrase;
    open_();
}
</script>
